            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/set-pin:
    post:
      tags:
        - Card Management
      summary: Sets the PIN for the given card.
      description: >
        Sets the PIN for the given card. The PIN is encrypted with the shared
        key derived from debiX's ephemeral public key from the '/start-set-pin'
        request 

        and the issuer's ephemeral private key corresponding to the issuer's
        ephemeral public key in this request (clientEphPubKey).  


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4440 - SET_PIN_NOT_ALLOWED_FOR_BLOCKED_OR_DELETED_CARD

        * 4442 - PIN_PREVIOUSLY_PASSED_TO_NEWER_CARD

        * 4450 - NO_CERTIFICATE_FOUND

        * 4451 - INVALID_JWS_SIGNATURE

        * 4452 - START_SET_PIN_NOT_CALLED

        * 4484 - BANK_CARDS_NOT_SUPPORTED_BY_ISSUER
      operationId: setPin
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        description: >-
          Signed request for the PIN set operation, containing card identifiers,
          encryption parameters and encrypted PIN.
        content:
          text/plain:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
            examples:
              JWS Header (decoded):
                value:
                  alg: ES256 (example)
                  typ: JWT
                  x5t#S256: 0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEp
              JWS Payload (decoded):
                value:
                  cardToken: CTK-85AB2A9FE2374A188A039F03F88E6EE1
                  cardTokenExtension:
                    cardSequenceNumber: 1
                    cardExpiry:
                      month: 6
                      year: 23
                  clientEphPubKey: SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
                  encryptedData: TG9yZW0gaXBzdW0gZG9sciBzaXI=
        required: true
      responses:
        '204':
          description: Set PIN was successful.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/pin-datamailer:
    post:
      tags:
