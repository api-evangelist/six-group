      type: object
      properties:
        dpan:
          $ref: '#/components/schemas/Dpan'
    UpdateCardStatusAction:
      description: Distinguishes the type of the card update.
      type: string
      enum:
        - BLOCK
        - UNBLOCK
        - DELETE_IMMEDIATELY
        - DELETE_AT_END_OF_NEXT_MONTH
    DigitalCard:
      description: Contains data of a digital card.
      type: object
      required:
        - digitalCardId
        - dpan
        - cardToken
        - scheme
        - status
        - digitalCardExpiry
        - wallet
        - productId
        - provisioningDate
      properties:
        digitalCardId:
          $ref: '#/components/schemas/DigitalCardId'
        dpan:
          $ref: '#/components/schemas/Dpan'
        cardToken:
          $ref: '#/components/schemas/CardToken'
        scheme:
          $ref: '#/components/schemas/Scheme'
        status:
          $ref: '#/components/schemas/DigitalCardStatus'
        pendingStatus:
          $ref: '#/components/schemas/DigitalCardPendingStatus'
        digitalCardExpiry:
          $ref: '#/components/schemas/YearMonth'
        wallet:
          $ref: '#/components/schemas/WalletProvider'
        tokenRequestor:
          $ref: '#/components/schemas/TokenRequestor'
        productId:
          description: Name of the card product.
          type: string
          examples:
            - Bank Card Gold
        provisioningDate:
          description: Provisioning date.
          type: string
          format: date-time
          examples:
            - '2021-10-03T16:03:09.101+02:00'
        deviceType:
          $ref: '#/components/schemas/DeviceType'
        deviceName:
          description: Name of the device that the device owner may use to identify it.
          type: string
          examples:
            - Peter's iPhone
        digitalCardStatusUpdateReason:
          $ref: '#/components/schemas/DigitalCardStatusUpdateReason'
    Presentment:
      description: Contains the data of a presentment.
      type: object
      required:
        - cardToken
        - settlementData
      properties:
        transactionType:
          description: |-
            - 100: Cash withdrawal
            - 101: Purchase of goods and services
            - 102: Refund to the cardholder
            - 103: ATM operator refund
            - 104: Cardholder change
            - 109: Deposit
            - 117: P2P payment charge sender
            - 118: P2P payment credit recipient
            - 132: Mail order
            - 133: Phone order
            - 136: Cash advance
            - 158: Purchase with Cashback (PwCB)
            - 189: Payment credit / Receive
            - 200: DCC cash withdrawal
            - 203: ATM operator refund DCC
          type: integer
          format: int32
          minimum: 0
          maximum: 999
          examples:
            - 101
        transactionDateTime:
          description: Date and time of the transaction.
          type: string
          format: date-time
          examples:
            - '2021-10-03T16:03:09.101+02:00'
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        settlementData:
          $ref: '#/components/schemas/SettlementData'
        transactionDataDetails:
          $ref: '#/components/schemas/TransactionDataDetails'
        originalCurrencyData:
          $ref: '#/components/schemas/OriginalCurrencyData'
        reversalData:
          $ref: '#/components/schemas/ReversalData'
        matchFlag:
          description: >-
            Indicates if the presentment was successfully matched with a
            transaction authorization.
          type: boolean
          examples:
            - true
        authorizationReference:
          description: >-
            The authorization which is referenced by this presentment. This is
            equal to the TransactionId of the referenced authorization returned
            by the authorization endpoint.
          type: string
          examples:
            - 6f4a6efe-fd8e-411a-8f23-adbf4bc4a6b6
    SettlementData:
      type: object
      description: Data pertaining to the settlement of a presentment.
      properties:
        clearingDate:
          description: Date of the settlement clearing.
          type: string
          format: date
          examples:
            - '2023-12-31'
        totalAmountClearingType:
          $ref: '#/components/schemas/ClearingType'
        transactionAmountClearingType:
          $ref: '#/components/schemas/ClearingType'
        feesProcessingType:
          $ref: '#/components/schemas/ClearingType'
        feesType:
          description: >-
            - 0: None

            - 1: Interchange or service fee: Commission in favor of / at the
            expense of the issuer bank

            - 2: Compensation to the location bank for transactions with foreign
            cards
          type: integer
          format: int32
          minimum: 0
          maximum: 9
          examples:
            - 1
        settlementAmounts:
          $ref: '#/components/schemas/SettlementAmounts'
    SettlementAmounts:
      type: object
      description: Settlement amounts in card currency.
      required:
        - totalAmount
      properties:
        totalAmount:
          $ref: '#/components/schemas/Amount'
        transactionAmount:
          $ref: '#/components/schemas/Amount'
        feesAmount:
          $ref: '#/components/schemas/Amount'
        transactionCashbackAmount:
          $ref: '#/components/schemas/Amount'
        transactionSurchargeAmount:
          $ref: '#/components/schemas/Amount'
        transactionTipAmount:
          $ref: '#/components/schemas/Amount'
    TransactionDataDetails:
      type: object
      properties:
        retrievalReference:
          $ref: '#/components/schemas/RetrievalReference'
        schemeTransactionId:
          $ref: '#/components/schemas/SchemeTransactionId'
        approvalCode:
          $ref: '#/components/schemas/ApprovalCode'
        retrievalSituation:
          description: |-
            Customer and location transaction context.
            - "SIS": Swiss in Switzerland / Liechtensteiner in Liechtenstein
            - "AIS": Foreigner in Switzerland / Foreigner in Liechtenstein
            - "SIA": Swiss abroad / Liechtensteiner abroad
          type: string
          maxLength: 3
        transactionCapture:
          description: >-
            Information about the place of authorization and the conclusion of
            the transaction.

            - "ONL": Online (authorized by SIX)

            - "OFF": Offline (authorized at the terminal)

            - "PIA": Authorized via PIA link at the issuer

            - "SAF": Store and forward

            - "VIS": Authorized via Visa network at the issuer

            - "SIE": Stand-In authorized through MCI

            - "SIP": Stand-In authorized through SIX

            - "MCI": Authorized via MCI net authorized by issuer
          type: string
          maxLength: 3
        captureMethod:
          description: |-
            Method by which the card was captured.
            - "MAG": Magnetic stripe
            - "EMV": Chip
            - "EFB": EMV fallback
            - "MAN": Manual entering 
            - "ECO": Electronic acquisition (e-commerce)
            - "CLS": Contactless
            - "QRC": QR code reader
            - "COF": Credential on file
          type: string
          maxLength: 3
        cardDataSource:
          description: |-
            Source of the card data
            - "CPR": Cardholder present
            - "CNP": Cardholder not present or unknown
            - "MOR": Order via mail
            - "TOR": Order via telephone
            - "MTO": Order via mail or telephone
            - "REC": Recurring transaction
            - "ECO": E-commerce
          type: string
          maxLength: 3
        multipleClearingIndicator:
          description: Indicates whether multiple clearings exist or it is a single booking
          type: boolean
          examples:
            - true
        settlementIndicator:
          description: Indicates whether the transaction is a settlement
          type: boolean
          examples:
            - true
        paymentTransactionType:
          description: |-
            - 0: Unknown
            - 1: Person to person
            - 2: Account to account
            - 3: Agent cash out
            - 4: Credit card bill payment
            - 5: Business disbursement
            - 6: Government/non-profit disbursement
            - 7: Merchant settlement
            - 8: Online gambling payout
            - 9: Other
            - 10: Business to business transfer
            - 11: Payroll pension disbursements
            - 12: Loyalty payments
            - 13: Gambling payout
            - 14: Cash to card
            - 901: Person to business
          type: integer
          format: int32
          minimum: 0
          maximum: 999
          examples:
            - 1
        cardAcceptor:
          $ref: '#/components/schemas/CardAcceptor'
        merchant:
          $ref: '#/components/schemas/Merchant'
        dpan:
          $ref: '#/components/schemas/Dpan'
        walletType:
          $ref: '#/components/schemas/WalletType'
        threeDsIndicator:
          $ref: '#/components/schemas/ThreeDsIndicator'
    ThreeDsIndicator:
      description: |-
        - 0: 3DS not supported by merchant
        - 1: 3DS supported by merchant but not provided by issuer
        - 2: Full 3DS transaction
        - 3: 3DS supported by merchant (Maestro Adv.Reg.Prog)
        - 4: Data only
        - 5: Issuer risk-based decisioning (only for Wallet transactions)
        - 6: Merchant risk-based decisioning
        - 7: Partial shipment or recurring payment
        - 8: ACQ SCA exemption no authentication
        - 9: Not applicable
      type: integer
      format: int32
      minimum: 0
      maximum: 9
      examples:
        - 1
    OriginalCurrencyData:
      type: object
      properties:
        originalTransactionAmounts:
          type: object
          properties:
            originalAmount:
              $ref: '#/components/schemas/Amount'
            cashbackAmount:
              $ref: '#/components/schemas/Amount'
            surchargeAmount:
              $ref: '#/components/schemas/Amount'
            tipAmount:
              $ref: '#/components/schemas/Amount'
        exchangeRate:
          description: Customer exchange rate for the original transaction
          type: string
          maxLength: 12
          examples:
            - '1.211226'
        referenceCountryCode:
          description: Country code of reference country according to ISO 3166
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          examples:
            - 756
    ReversalData:
      type: object
      properties:
        reversalType:
          description: |-
            - 0: Normal booking
            - 1: Second presentment
            - 2: (Partial) Reversal of presentment
            - 3: Reversal of second presentment
            - 4: Chargeback
            - 5: Reversal of chargeback
            - 7: Partial chargeback
            - 8: Partial second presentment
          type: integer
          format: int32
          maximum: 9
          examples:
            - 7
        originalTransactionDateTime:
          description: Datetime of the original transaction
          type: string
          format: date-time
          examples:
            - '2021-10-03T16:03:09.101+02:00'
        issuerReference:
          description: Card issuer reference
          type: integer
          format: int32
          maximum: 999999
          examples:
            - 230776
        chargebackReasonCode:
          description: Reason for a chargeback transaction
          type: integer
          format: int32
          maximum: 9999
          examples:
            - 4555
    DeviceType:
      description: |-
        Type of the device where the digital card is stored. 
        - "HCE"
        - "SPAY_PHONE"
        - "SPAY_TABLET"
        - "SPAY_WATCH"
        - "SPAY_TV"
        - "IPHONE"
        - "IWATCH"
        - "APPLE_WATCH"
        - "IPAD"
        - "MAC_BOOK"
        - "ANDROID_PHONE"
        - "ANDROID_TABLET"
        - "ANDROID_WATCH"
        - "MOBILE_PHONE"
        - "TABLET"
        - "WATCH"
        - "MOBILE_PHONE_OR_TABLET"
        - "BRACELET"
        - "PC"
        - "HOUSEHOLD"
        - "WEARABLE"
        - "AUTOMOBILE"
        - "UNKNOWN"
      type: string
      examples:
        - IPHONE
    CardId:
      description: >-
        Complex object representing a card consisting of bank clearing number,
        card number, card type, card sequence number and card expiry.
      type: object
      required:
        - bankClearingNumber
        - cardNumber
        - cardType
        - cardSequenceNumber
        - cardExpiry
      properties:
        bankClearingNumber:
          $ref: '#/components/schemas/BankClearingNumber'
        cardNumber:
          $ref: '#/components/schemas/CardNumber'
        cardType:
          $ref: '#/components/schemas/CardType'
        cardSequenceNumber:
          $ref: '#/components/schemas/CardSequenceNumber'
        cardExpiry:
          $ref: '#/components/schemas/YearMonth'
    ShortCardId:
      description: >-
        Complex object representing a card consisting of bank clearing number,
        card number and card type.
      type: object
      required:
        - bankClearingNumber
        - cardNumber
        - cardType
      properties:
        bankClearingNumber:
          $ref: '#/components/schemas/BankClearingNumber'
        cardNumber:
          $ref: '#/components/schemas/CardNumber'
        cardType:
          $ref: '#/components/schemas/CardType'
    BankClearingNumber:
      description: >-
        Unique number used to identify each bank agency or branch in the bank
        directory.
      type: integer
      format: int32
      minimum: 100
      maximum: 99999
      examples:
        - 50000
    AccountNumber:
      description: Unique number identifying a bank account.
      type: string
      minLength: 1
      maxLength: 16
      examples:
        - AB-4567890123456
    Iban:
      description: IBAN of the bank account for which the card was issued.
      type: string
      minLength: 21
      maxLength: 21
      examples:
        - CH3456789012345678901
    CardMaterial:
      description: >-
        Distinguishes physical from virtual cards. VIRTUAL not allowed for bank
        cards.
      type: string
      enum:
        - PHYSICAL
        - VIRTUAL
    CardPlasticCode:
      description: Plastic code of the card.
      type: string
      minLength: 2
      maxLength: 2
      examples:
        - F0
    CardOrderReason:
      description: >-
        This setting determines the priority in which a physical card is
        ordered. Daily business orders are processed with higher priority and
        sent to the producer after 18:30. Card renewal orders due to card
        expiration are processed with lower priority and sent to the producer
        after 08:00.
      type: string
      enum:
        - DAILY_BUSINESS
        - CARD_RENEWAL
      default: DAILY_BUSINESS
    BranchNumber:
      description: Branch number of the site where the account was initially created.
      type: integer
      format: int32
      minimum: 0
      maximum: 9999
      examples:
        - 1
    SubCardType:
      description: >-
        Sub card type that is linked to a dedicated BIN range and specifies a
        product like 'Platinum', 'EUR' or 'Student'. It must be configured in
        bank master data, otherwise field can not be used.
      type: string
      minLength: 2
      maxLength: 2
      examples:
        - A1
    CardEncryptionSubCardType:
      description: >-
        Specifies the sub card type of the card, if any. Set the 'value'
        property to the sub card type if available; otherwise, set it to 'null'.
        Providing this object avoids additional requests to Worldline to
        retrieve the card's PAN.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/SubCardType'
    CardStatus:
      description: The status of the card.
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - DELETED
        - SUSPENSION_PENDING
        - RESUMPTION_PENDING
        - DELETE_PENDING
    CardNumber:
      description: Card number of the card.
      type: integer
      format: int32
      minimum: 1
      maximum: 99999999
      examples:
        - 12345678
    CardType:
      description: |-
        A single digit that distinguishes the card types of the schemes.
        - 1: Debit mastercard
        - 3: Visa debit
        - 6: Bank card
      type: integer
      format: int32
      minimum: 1
      maximum: 6
    CardSequenceNumber:
      description: Sequence number of the card.
      type: integer
      format: int32
      minimum: 0
      maximum: 9
      examples:
        - 2
    CardToken:
      description: Unique card token of a card.
      type: string
      pattern: ^CTK-[0-9a-fA-F]{32}$
      minLength: 36
      maxLength: 36
      examples:
        - CTK-54716A6080B14CF19CEA3C170F85B1DD
    CardTokenExtension:
      description: Extension to card token to identify a card.
      type: object
      required:
        - cardExpiry
        - cardSequenceNumber
      properties:
        cardExpiry:
          $ref: '#/components/schemas/YearMonth'
        cardSequenceNumber:
          $ref: '#/components/schemas/CardSequenceNumber'
    CardInstanceToken:
      description: Unique card instance token of the card.
      type: string
      pattern: ^CITK-[0-9a-fA-F]{32}$
      minLength: 37
      maxLength: 37
      examples:
        - CITK-1744BC4B31C945A1942F4CCF65EC8D99
    DigitalCardStatusUpdateReason:
      description: The reason for the status update of the digital card.
      type: string
      enum:
        - ISSUER_DECISION
        - USER_DECISION
    CardStatusUpdateReason:
      description: The reason for the status update of the card.
      type: string
      enum:
        - ISSUER_DECISION
        - USER_DECISION
      examples:
        - USER_DECISION
    CardBlockInformation:
      description: Contains information about blocked cards.
      type: object
      properties:
        blockReason:
          $ref: '#/components/schemas/CardBlockReason'
        blockOrigin:
          $ref: '#/components/schemas/CardBlockOrigin'
        blockInterface:
          $ref: '#/components/schemas/CardBlockInterface'
        blockedCardReplacement:
          $ref: '#/components/schemas/BlockedCardReplacement'
        unblockCardByCardholderAllowed:
          description: |
            Defines if the cardholder is allowed to unblock the card.
          type: boolean
          examples:
            - true
    CardBlockReason:
      description: The reason why the card was blocked.
      type: string
      enum:
        - NO_INFORMATION
        - CARD_LOST_WITHOUT_PIN
        - CARD_STOLEN_WITHOUT_PIN
        - FRAUD
        - CREDIT_STANDING
        - TOO_MANY_INVALID_PIN_ATTEMPTS
        - CARD_LOST_WITH_PIN
        - CARD_STOLEN_WITH_PIN
        - PICK_UP_BM_TM
        - CARD_DID_NOT_ARRIVE
        - PIN_DID_NOT_ARRIVE
        - FRAUD_SUSPECTED_ANALYSIS
        - FRAUD_SUSPECTED_CARDHOLDER_FEEDBACK_REQUIRED
        - TECHNICAL_REASON
        - DEFECTIVE_CARD
        - CARD_TEMPORARILY_BLOCKED
    CardBlockOrigin:
      description: Initiator and channel of the card blocking.
      type: string
      enum:
        - ONLINE_BANKING_BY_CARDHOLDER
        - MOBILE_BANKING_BY_CARDHOLDER
        - THREE_DS_CARDMANAGEMENT_APP_BY_CARDHOLDER
        - BACKEND_OF_BANK_BY_BANK
        - BACKEND_OF_BANK_BY_CARDHOLDER
        - BANK_DEBIT_ONLINE_WEB_BY_BANK
        - BANK_DEBIT_ONLINE_WEB_BY_CALL_CARDHOLDER
        - SIX_CALLCENTER_BY_CALL_CARDHOLDER
        - SIX_CALLCENTER_DEBIT_ONLINE_WEB_VIA_BLOCKING_MASK_BY_CALL_CARDHOLDER
        - SIX_BY_THIRD_PARTY_ORDER
        - SIX_DEBIT_ONLINE_WEB_VIA_BLOCKING_MASK_BY_THIRD_PARTY_ORDER
        - SIX_DEBIT_ONLINE_WEB_VIA_CARD_MASK_BY_THIRD_PARTY_ORDER
        - SIX_FRAUD_BY_RISKSHIELD_MANUAL
        - SIX_FRAUD_BY_RISKSHIELD_AUTOMATIC
        - SIX_FRAUD_BY_DEBIX
        - SIX_BY_BLOCKING_APPLICATION
    CardBlockOriginViaBank:
      description: >-
        Initiator and channel of the card blocking when the card is blocked via
        the bank.
      type: string
      enum:
        - ONLINE_BANKING_BY_CARDHOLDER
        - MOBILE_BANKING_BY_CARDHOLDER
        - THREE_DS_CARDMANAGEMENT_APP_BY_CARDHOLDER
        - BACKEND_OF_BANK_BY_BANK
        - BACKEND_OF_BANK_BY_CARDHOLDER
    CardBlockInterface:
      description: The interface used for blocking the card.
      type: string
      enum:
        - DEBIX_API
        - DEBIX_APP
        - DEBIX_PORTAL
        - DEBIT_ONLINE_WEB
        - DEBIT_ONLINE_XML
        - BLOCKING_APPLICATION_GENERATED_BY_SIX
    BlockedCardReplacement:
      description: >-
        Indicates the need of a card replacement when the card has been blocked.
        This is only an indicator and does not trigger the actual card
        replacement.
      type: string
      enum:
        - NO_REPLACEMENT
        - CARD
        - CARD_WITH_PIN_MAILER
        - CARD_WITH_PIN_AND_OTRC_MAILER
        - CARD_WITH_OTRC_MAILER
        - CARD_WITH_UNKNOWN_MAILER
    PinRecoveryStatus:
      description: The status of the PIN recovery.
      type: string
      enum:
        - NO_PIN_ORDERED
        - NEW_PIN_ORDERED_PIN_CHANGE_REQUIRED
        - NEW_PIN_ORDERED_RECOVERY_PROCESSED
        - NEW_PIN_ORDERED_RECOVERY_CONFIRMED
        - NEW_PIN_ORDERED_RECOVERY_NOK
    DigitalCardStatus:
      description: The status of the digital card.
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - DELETED
    DigitalCardPendingStatus:
      description: The requested but pending status of the digital card.
      type: string
      enum:
        - RESUMPTION_PENDING
        - SUSPENSION_PENDING
        - DELETION_PENDING
    MerchantCategoryCode:
      description: >-
        The merchant category code. In a whitelist, the presence of 0 signifies
        that all merchant category codes are allowed.
      type: integer
      format: int32
      minimum: 0
      maximum: 9999
      examples:
        - 7995
    MoneySendReceiveAllowance:
      description: >-
        Defines conditions if money send to and receive from another cardholder
        is allowed.
      type: string
      enum:
        - NOT_ALLOWED
        - RECEIVE_ALLOWED
        - SEND_ALLOWED
        - RECEIVE_AND_SEND_ALLOWED
    GamblingAndBettingAllowance:
      description: Defines condition when gambling and betting transactions are allowed.
      type: string
      enum:
        - ALLOWED
        - NOT_ALLOWED
        - CARD_NOT_PRESENT_NOT_ALLOWED
        - CARD_PRESENT_NOT_ALLOWED
    ContactlessActivationStatus:
      description: Describes the contactless activation status of the card.
      type: string
      enum:
        - UNKNOWN
        - ACTIVATED_CONFIRMED
        - CARD_WITHOUT_CONTACTLESS
        - DEACTIVATED_UNCONFIRMED
        - DEACTIVATED_CONFIRMED
        - DEACTIVATION_PENDING
        - ACTIVATED_UNCONFIRMED
        - ACTIVATION_PENDING
        - NEVER_ACTIVATED
    ContactlessActivationMode:
      description: Describes the contactless activation mode used during card ordering.
      type: string
      enum:
        - ACCORDING_TO_EMV
        - IMMEDIATE
        - AUTOMATIC
        - DEFERRED
    WalletProvider:
      description: |-
        - "WALLET"
        - "ECOM"
        - "APPLE_PAY"
        - "SAMSUNG_PAY"
        - "GOOGLE_PAY"
        - "GARMIN_PAY"
        - "FITBIT_PAY"
        - "FACEBOOK"
        - "VISA_CHECKOUT"
        - "NETFLIX"
        - "ASIA_PAY_LIMITED"
        - "CYBERSOURCE"
        - "CHERRI_TECH"
        - "ADYEN"
        - "AMAZON"
        - "MENA_FZ_LLC"
        - "GLOBAL_PYT_AUSTRALIA"
        - "PAYSCOUT"
        - "SAFECHARGE"
        - "SECURECO"
        - "WORLDPAY"
        - "PAYPAL"
        - "BAMBORA_ONLINE"
        - "MYOB"
        - "HUAWEI_PAY"
      type: string
      examples:
        - APPLE_PAY
    WalletType:
      description: |-
        - "A": Apple Pay
        - "F": Fitbit
        - "G": G&D Wallet ErsteBank
        - "I": Raipay
        - "L": LAKS/Disiseq
        - "M": Merchant Tokenization
        - "O": Google Pay
        - "P": PSA-Wallet
        - "R": Garmin/Fitpay
        - "S": Samsung Pay
        - "T": Tappy
        - "W": Fidesmo
        - "X": Xiaomi
        - "Z": Zepp1
        - "?": Unknown Wallet Type
      type: string
      maxLength: 1
      examples:
        - A
    TokenRequestor:
      description: Information about the token requestor.
      type: object
      properties:
        id:
          description: The id of the token requestor.
          type: string
          maxLength: 11
          examples:
            - '1111111111'
        name:
          description: The name of the token requestor.
          type: string
          maxLength: 64
          examples:
            - Zalando
    YearMonth:
      type: object
      required:
        - month
        - year
      properties:
        month:
          description: The two digit number of the month starting at 01 for January.
          type: string
          examples:
            - '01'
        year:
          description: The last two digits of the year.
          type: string
          examples:
            - '21'
    Scheme:
      description: Scheme of the card.
      type: string
      enum:
        - MASTERCARD
        - VISA
    Dpan:
      description: Number of the digital card.
      type: string
      pattern: ^[4,5][0-9]{15}$
      minLength: 16
      maxLength: 16
      examples:
        - '4234567890123456'
    RejectedDigitalCard:
      type: object
      properties:
        dpan:
          $ref: '#/components/schemas/Dpan'
        error:
          $ref: '#/components/schemas/ErrorDetail'
    DigitalCardId:
      description: debiX id of the digital card.
      type: string
      examples:
        - eb404f8d-656b-4e51-8872-88c42fa55536
    TransactionId:
      description: Worldline unique id of the authorization.
      type: string
      maxLength: 36
      examples:
        - 9e19df54-47cb-494b-84dc-1c126e95a05c
    Amount:
      description: Original transaction amount.
      type: object
      required:
        - currency
        - unscaledAmount
        - scale
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        unscaledAmount:
          description: Original unscaled transaction amount.
          type: integer
          format: int64
          examples:
            - 2000
        scale:
          description: Scale of transaction amount.
          type: integer
          format: int32
          examples:
            - 1
    Currency:
      description: The currency according to ISO 4217.
      type: string
      maxLength: 3
      examples:
        - CHF
    CardAcceptor:
      description: The card acceptor, e.g. merchant, as assigned by the acquirer.
      type: object
      required:
        - id
        - merchantCategoryCode
      properties:
        id:
          description: Identification of the card acceptor.
          type: string
          minLength: 1
          maxLength: 15
          examples:
            - '87040'
        name:
          description: Name.
          type: string
          examples:
            - Meier Gmbh
        streetName:
          description: Location street name.
          type: string
        postalCode:
          description: Location postal code.
          type: string
        city:
          description: Location city.
          type: string
        regionCode:
          description: Location region code.
          type: string
        countryCode:
          description: Location country code.
          type: string
        merchantCategoryCode:
          description: Category code of the merchant.
          type: string
    Merchant:
      description: >-
        The enriched merchant data, only delivered if the issuer is enabled for
        enriched merchant data.
      type: object
      required:
        - id
        - logoAvailable
      properties:
        id:
          description: Identification of the merchant.
          type: string
          minLength: 1
          maxLength: 36
          examples:
            - '496'
        name:
          description: Pretty name of the merchant.
          type: string
          examples:
            - Yallo
        merchantCategory:
          description: Merchant category name.
          type: string
          examples:
            - Telco
        logoAvailable:
          description: Indicates if a merchant logo is available.
          type: boolean
          examples:
            - true
        address:
          $ref: '#/components/schemas/Address'
        location:
          $ref: '#/components/schemas/Location'
        contact:
          $ref: '#/components/schemas/Contact'
    Location:
      type: object
      required:
        - longitude
        - latitude
      properties:
        longitude:
          description: Longitude
          type: number
          format: double
          examples:
            - 8.5426102
        latitude:
          description: Latitude
          type: number
          format: double
          examples:
            - 47.3717597
    Contact:
      type: object
      properties:
        website:
          description: Website
          type: string
          minLength: 1
          examples:
            - www.myshop.ch
        phoneNumber:
          description: Phone number
          type: string
          minLength: 1
          examples:
            - '+41795625655'
    Address:
      type: object
      properties:
        street:
          description: Street name and street number
          type: string
          minLength: 1
          examples:
            - Hardturmstrasse 201
        postalCode:
          description: Postal code
          type: string
          minLength: 1
          examples:
            - '8004'
        city:
          description: City name
          type: string
          minLength: 1
          examples:
            - Zürich
        countryCode:
          description: Country code (ISO 3166 alpha-2 or alpha-3)
          type: string
          minLength: 2
          maxLength: 3
          examples:
            - CH
    MerchantLogoResponse:
      type: object
      properties:
        merchantLogo:
          $ref: '#/components/schemas/Image'
    RetrievalReference:
      description: Reference number assigned by acquirer.
      type: string
      maxLength: 12
      examples:
        - '120909092386'
    SchemeTransactionId:
      description: Transaction id assigned by the scheme during the first authorization.
      type: string
      maxLength: 36
      examples:
        - MDSJ9CC6I1134
    ApprovalCode:
      description: >-
        Series of characters that can be set by the issuer when the
        authorization takes place.
      type: string
      maxLength: 6
      examples:
        - '803051'
    ClearingType:
      description: Payment clearing type.
      type: string
      enum:
        - DEBIT
        - CREDIT
    Image:
      description: Image used for the merchant logo.
      required:
        - image
        - version
        - mimeType
      type: object
      properties:
        image:
          description: Base64-encoded image
          type: string
          format: byte
          pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
          examples:
            - >-
              2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT=
        width:
          description: Width of the image in number of pixels.
          type: integer
          examples:
            - 1000
        height:
          description: Height of the image in number of pixels.
          type: integer
          examples:
            - 600
        version:
          description: >-
            Version of the current image. The value changes when image is
            changed. This value will be compared with value from 'If-None-Match'
            to find out if the image is in sync with the client.
          type: string
          examples:
            - be5d87a6-1c76-49d7-9a7f-75fa411b7e96
        mimeType:
          description: MIME type of the current image.
          type: string
          examples:
            - image/svg+xml
    FirstName:
      description: First name
      type: string
      maxLength: 25
      examples:
        - Peter
    FamilyName:
      description: Family name
      type: string
      maxLength: 25
      examples:
        - Schweizer
    DatamailerDeliveryDestination:
      description: Specifies the delivery destination for OTRC, PIN, and card datamailer.
      type: string
      enum:
        - DELIVER_TO_BANK
        - DELIVER_TO_CARDHOLDER
    DatamailerExpressCode:
      description: Defines the express code of OTRC and PIN datamailer delivery.
      type: string
      enum:
        - A_POST
        - B_POST
        - REGISTERED
      default: A_POST
    OtrcDelivery:
      description: Deprecated and will be ignored. Delivery type of OTRC.
      type: string
      enum:
        - NONE
        - DATAMAILER
        - ONLINE
      default: NONE
    ProducerCode:
      description: >-
        Defines the producer of the ordered card. Must only be set for a
        physical card order.
      type: string
      enum:
        - THALES
        - EXCEET_GERMANY
        - EXCEET_SWITZERLAND
        - NID
    ProducerInfo:
      description: >-
        Information for the producer of the card. E.g. to print the EUR-label on
        the card.
      type: string
    EmvProfile:
      description: >-
        Information about the EMV-Profile. Must be set for a physical card
        order.
      type: object
      required:
        - emvCurrency
      properties:
        emvCurrency:
          $ref: '#/components/schemas/Currency'
        emvProfileId:
          description: >-
            The identifier of an EMV-Profile. Must correspond to the field
            ChipApplication.
          type: integer
          examples:
            - 4
    CardholderDataTrack:
      description: >
        A formatted combination of family name, name and title. Must only be set
        for a Mastercard physical card order.

        Valid formats include:
          - FAMILYNAME/
          - FAMILYNAME/NAME
          - FAMILYNAME/NAME.DR
          - FAMILYNAME/.DR
      type: string
      maxLength: 26
      minLength: 2
      examples:
        - SCHWEIZER/PETER
    BankCardLine:
      description: >-
        Bank card specific field. The content of this field has to be agreed
        with the card producer and will not be checked by SIX.
      type: string
    CardLine:
      description: >-
        This line will be printed on the front side of the card. At least the
        first card line is required for a physical card order.
      type: string
    UseBankCardWithPin:
      type: boolean
      description: >-
        Bank card specific field. Indicator of whether the bank card is used
        with or without PIN.
    Birthdate:
      description: Date of birth.
      type: string
      format: date
      examples:
        - '2000-12-31'
    AccountAuthority:
      description: Indicates who has the right to draw on the account.
      type: object
      properties:
        firstName:
          $ref: '#/components/schemas/FirstName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        birthdate:
          $ref: '#/components/schemas/Birthdate'
    PhoneNumber:
      description: >-
        Mobile or landline phone number. Note: phoneNumber is a mandatory
        parameter which must be provided to register a card with authentication
        method SMS_ONLY, PIN, BIOMETRIC or BIOMETRIC_WITH_PIN_FALLBACK.
        Furthermore, phoneNumber must also be provided in case the issuer
        desires to register a card for DELEGATED as primary authentication
        method, with additionally SMS as fallback (as secondary authentication
        method).  For issuers with special regulations (e.g. PSD2), please refer
        to the additional indications provided under the “password” field.
      type: string
      pattern: ^([+]|00)[1-9][0-9]{8,18}$
      examples:
        - '+41797778899'
    Language:
      description: Correspondence language.
      type: string
      enum:
        - DE
        - FR
        - IT
        - EN
    ChipApplication:
      description: >-
        Indicates what chip will be applied to the card. If no chipApplication
        is provided, EMVI20 will be applied in the order.
      type: string
      enum:
        - EMVI20
        - EMVI24
    ThreeDsInformation:
      description: Contains 3DS data provided by Worldline.
      type: object
      required:
        - paymentAuthenticationMethods
      properties:
        paymentAuthenticationMethods:
          $ref: '#/components/schemas/PaymentAuthenticationMethods'
        mobilePhoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
    PaymentAuthenticationMethods:
      description: Container for the available authentication methods.
      type: object
      required:
        - oob
        - ta
        - otp
        - password
      properties:
        oob:
          description: Details of the Out Of Band (OOB) authentication method.
          type: object
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/AuthenticationMethodStatus'
            id:
              description: OOB id.
              type: string
              maxLength: 36
        ta:
          description: >-
            Details of the Trusted Authentication via separate app (TA)
            authentication method.
          type: object
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/AuthenticationMethodStatus'
            id:
              description: TA user id.
              type: string
              maxLength: 36
        otp:
          type: object
          description: Details of the One Time Password (OTP) authentication method.
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/AuthenticationMethodStatus'
        password:
          type: object
          description: Details about the password authentication method.
          required:
            - status
          properties:
            status:
              $ref: '#/components/schemas/AuthenticationMethodStatus'
    AuthenticationMethodStatus:
      description: Status of an authentication method.
      type: string
      enum:
        - ENABLED
        - DISABLED
        - BLOCKED
    ThreeDsData:
      description: >-
        Relevant data to register a card for 3DS with a specific authentication
        method based on the setup desired by the issuer (i.e. for 3DS via SIX
        SDK or 3DS OOB).
      type: object
      required:
        - language
        - authenticationMethod
      properties:
        userId:
          description: >-
            Identifier assigned to a particular user by the issuer. Note: userId
            is a mandatory parameter when registering a card with authentication
            method PIN, BIOMETRIC or BIOMETRIC_WITH_PIN_FALLBACK.
          type: string
          minLength: 1
          examples:
            - '2345872'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        language:
          $ref: '#/components/schemas/Language'
        authId:
          $ref: '#/components/schemas/AuthId'
        authenticationMethod:
          $ref: '#/components/schemas/AuthenticationMethod'
        biometricType:
          $ref: '#/components/schemas/BiometricType'
        pinCode:
          $ref: '#/components/schemas/PinCode'
        password:
          $ref: '#/components/schemas/Password'
    PartialThreeDsData:
      description: Partial data pertaining to a 3DS registration.
      type: object
      properties:
        userId:
          description: >-
            Identifier assigned to a particular user by the issuer. Note: userId
            is a mandatory parameter when registering a card with authentication
            method PIN, BIOMETRIC or BIOMETRIC_WITH_PIN_FALLBACK.
          type: string
          minLength: 1
          examples:
            - '2345872'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        language:
          $ref: '#/components/schemas/Language'
        authId:
          $ref: '#/components/schemas/AuthId'
        authenticationMethod:
          $ref: '#/components/schemas/AuthenticationMethod'
        biometricType:
          $ref: '#/components/schemas/BiometricType'
        pinCode:
          $ref: '#/components/schemas/PinCode'
        password:
          $ref: '#/components/schemas/Password'
    OtrcDatamailerOrderRequest:
      description: Details of the OTRC datamailer order request.
      type: object
      required:
        - delivery
        - expressCode
      properties:
        delivery:
          description: Delivery destination of the OTRC datamailer.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        expressCode:
          description: Defines the express code of the OTRC datamailer delivery.
          $ref: '#/components/schemas/DatamailerExpressCode'
        deliveryInformation:
          description: Delivery information for the OTRC datamailer.
          $ref: '#/components/schemas/DeliveryInformation'
        mailerText:
          $ref: '#/components/schemas/MailerTextCode'
    AuthenticationMethod:
      description: >-
        User authentication method. For 3DS Out-of-Band (OOB), authentication
        method DELEGATED must be selected.
      type: string
      enum:
        - PIN
        - BIOMETRIC
        - BIOMETRIC_WITH_PIN_FALLBACK
        - DELEGATED
        - SMS_ONLY
        - NONE
    AuthId:
      description: >-
        Identifier for the device used for 3DS. Note: authId is a mandatory
        parameter which must be provided when registering a card with
        authentication method PIN, BIOMETRIC, BIOMETRIC_WITH_PIN_FALLBACK or
        DELEGATED.
      type: string
      minLength: 1
      maxLength: 36
      examples:
        - '480463608'
    BiometricType:
      description: >-
        Type of biometric authentication; required for authentication method
        BIOMETRIC and BIOMETRIC_WITH_PIN_FALLBACK.
      type: string
      enum:
        - ANDROID_BIOMETRIC
        - IOS_BIOMETRIC
    PinCode:
      description: >-
        PIN code used for 3DS authentication; required for authentication method
        PIN and BIOMETRIC_WITH_PIN_FALLBACK.
      type: string
      minLength: 1
      examples:
        - '12345'
    Password:
      description: >-
        This parameter must be used exclusively by issuers with special
        regulations (e.g., PSD2). It must be provided if the issuer intends to
        register a card for 3DS with SMS as secondary authentication method
        (i.e. SMS as fallback) or if the issuer intends to register a card with
        SMS_ONLY as primary and unique authentication method. In these cases,
        the phoneNumber field must also be provided.
      type: string
      minLength: 1
      examples:
        - password
    CardHolderName:
      description: The cardholder name as printed on the card.
      type: string
      minLength: 2
      maxLength: 26
      examples:
        - Peter Meier
    EmailAddress:
      description: Email address to identify the customer.
      type: string
      minLength: 1
      examples:
        - peter.schweizer@mailbox.org
    BankApiError:
      description: Information about an error on API requests.
      type: object
      required:
        - applicationError
        - errorCode
      properties:
        applicationError:
          description: The name of the application error.
          type: string
          examples:
            - OPERATION_FAILED
        errorCode:
          description: Code describing the error.
          type: integer
          format: int32
          examples:
            - 5001
        description:
          description: >-
            A human readable explanation specific to this occurrence of the
            problem.
          type: string
          examples:
            - The requested operation failed.
        errors:
          description: List of error details.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorDetail'
        errorToken:
          description: >-
            A generated error token referencing the actual error and logged on
            the server.
          type: string
          examples:
            - 618503aa-7beb-4d3d-986e-36f1fdbd0e13
    ErrorDetail:
      type: object
      required:
        - errorCode
      properties:
        errorCode:
          description: Code describing the error.
          type: integer
          format: int32
          examples:
            - 42
        description:
          description: The message describing the error.
          type: string
          examples:
            - >-
              The answer to the great question of Life, the Universe and
              Everything.
    OtrcOrderResponse:
      description: Contains the OTRC information.
      type: object
      required:
        - otrc
        - otrcExpirationDateTime
      properties:
        otrc:
          description: Value of the OTRC.
          type: integer
        otrcExpirationDateTime:
          description: Date and time when the OTRC will expire.
          type: string
          format: date-time
          examples:
            - '2024-10-03T16:03:09.101+02:00'
    VisaADCreateAliasAndRegisterCardsRequest:
      description: Create Alias and Register Cards request.
      type: object
      required:
        - aliasType
        - aliasValue
        - consent
        - profile
        - cards
      properties:
        aliasType:
          $ref: '#/components/schemas/VisaADAliasType'
        aliasValue:
          $ref: '#/components/schemas/VisaADAliasValue'
        consent:
          $ref: '#/components/schemas/VisaADConsent'
        profile:
          $ref: '#/components/schemas/VisaADProfile'
        cards:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/VisaADCard'
    VisaADCreateAliasAndRegisterCardsResponse:
      description: Create Alias and Register Cards response.
      type: object
      required:
        - aliasId
      properties:
        aliasId:
          $ref: '#/components/schemas/VisaADAliasId'
    VisaADGetAliasResponse:
      description: Get Alias response.
      type: object
      required:
        - aliasValue
        - consent
        - profile
      properties:
        aliasValue:
          $ref: '#/components/schemas/VisaADAliasValue'
        consent:
          $ref: '#/components/schemas/VisaADConsent'
        profile:
          $ref: '#/components/schemas/VisaADProfile'
        aliasType:
          $ref: '#/components/schemas/VisaADAliasType'
        aliasStatus:
          $ref: '#/components/schemas/VisaADAliasStatus'
    VisaADUpdateAliasRequest:
      description: Update Alias request.
      type: object
      required:
        - consent
        - profile
      properties:
        consent:
          $ref: '#/components/schemas/VisaADConsent'
        profile:
          $ref: '#/components/schemas/VisaADProfile'
    VisaADUpdateAliasStatusRequest:
      description: Update Alias Status request.
      type: object
      required:
        - aliasStatus
      properties:
        aliasStatus:
          $ref: '#/components/schemas/VisaADAliasUpdatingStatus'
    VisaADRegisterCardRequest:
      description: Register Card request.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/VisaADCard'
    VisaADUpdateCardRequest:
      description: Update Card request.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/VisaADCard'
    VisaADRetrieveCardResponse:
      description: Retrieve Card response.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/VisaADCard'
    VisaADRetrieveAllCardsResponse:
      description: Retrieve All Card response.
      type: object
      required:
        - cards
      properties:
        cards:
          type: array
          items:
            $ref: '#/components/schemas/VisaADCard'
    VisaADConsent:
      description: Consent details.
      type: object
      required:
        - presenter
        - validFromDateTime
        - version
      properties:
        presenter:
          description: Identifies the presenter of consent to the consumer.
          type: string
          examples:
            - Bank A
        validFromDateTime:
          description: >-
            Date and time from which on the consent is valid, in ISO UTC format
            YYYY-MM-DDThh:mm:ss.000Z. Only accepts present and past dates.
          type: string
          format: date-time
          examples:
            - '2021-12-01T10:00:00Z'
        version:
          description: >-
            Specific version of the terms and conditions that the customer
            accepts for the user solution.
          type: string
          minLength: 1
          maxLength: 9
          examples:
            - '1.0'
    VisaADCard:
      description: Card in the context of Visa Alias Directory.
      type: object
      required:
        - nameOnCard
        - cardType
        - billingAddress
        - cardToken
      properties:
        nameOnCard:
          $ref: '#/components/schemas/VisaADNameOnCard'
        cardType:
          $ref: '#/components/schemas/VisaADCardType'
        billingAddress:
          $ref: '#/components/schemas/VisaADBillingAddress'
        cardToken:
          $ref: '#/components/schemas/CardToken'
        preferredFor:
          $ref: '#/components/schemas/VisaADPreferredFor'
    VisaADNameOnCard:
      description: The name which is printed on the card.
      type: string
      minLength: 1
      maxLength: 120
      examples:
        - Peter Schweizer
    VisaADCardType:
      description: >-
        Card type description. Reference to Field 62.23—Product ID of available
        card products.
      type: string
      minLength: 1
      maxLength: 70
      examples:
        - Visa Platinum
    VisaADPreferredFor:
      description: >
        Indicates if a payment credential is a preferred **Receiving**,
        **Sending**, or **Paying** account. 

        **Receiving** allows for funds to be pushed into the payment
        credential. 

        **Sending** allows for funds to be sent from the payment credential. 

        **Paying** allows for the payment credential to be used for purchases. 

        More than one preferred type can be used.
      type: array
      minItems: 1
      maxItems: 3
      items:
        $ref: '#/components/schemas/VisaADPreferredForType'
    VisaADPreferredForType:
      type: string
      enum:
        - RECEIVE
        - SEND
        - PAY
      examples:
        - RECEIVE
    VisaADBillingAddress:
      type: object
      required:
        - country
      properties:
        city:
          description: |
            City

            ISO20022 element name: Creditor -> Postal Address -> Town Name
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - Zürich
        state:
          description: State (ISO 3166-2)
          type: string
          minLength: 1
          maxLength: 16
          format: We recommend to use the ISO 3166-2
          examples:
            - CH-ZH
        country:
          description: |
            Country code using 3-character ISO 3166 (Alpha 3) format.

            ISO20022 element name: Creditor -> Postal Address -> Country
          type: string
          minLength: 3
          maxLength: 3
          format: We recommend to use the Alpha-3 format
          examples:
            - CHE
        postalCode:
          description: |
            Postal code number of the addresses
            ISO20022 element name: Creditor -> Postal Address -> Postal Code
          type: string
          minLength: 1
          maxLength: 16
          examples:
            - '8000'
        streetName:
          description: Street Name
          type: string
          minLength: 1
          maxLength: 60
          examples:
            - Bahnhofstrasse
        addressLine1:
          description: |
            Address line 1.

            ISO20022 element name: Creditor -> Postal Address -> Address Line
          type: string
          minLength: 0
          maxLength: 99
          examples:
            - Zurich Coffee Shop
        addressLine2:
          description: |
            Address line 2.

            ISO20022 element name: Creditor -> Postal Address -> Address Line
          type: string
          minLength: 0
          maxLength: 99
          examples:
            - z. H. Hans Ruedi Rüdisüli
        buildingNumber:
          description: |
            Building number.

            ISO20022 element name: Creditor -> Postal Address -> Building Number
          type: string
          minLength: 1
          maxLength: 60
          examples:
            - '18'
        minorSubdivisionCode:
          description: >
            Minor Subdivision Code.


            ISO20022 element name: Creditor -> Postal Address -> Country Sub
            Division
          type: string
          examples:
            - ZH
          minLength: 1
          maxLength: 50
    VisaADDateOfBirth:
      description: Date ISO-8601 Format https://www.w3.org/TR/NOTE-datetime.
      type: string
      minLength: 10
      maxLength: 10
      pattern: ^\d\d\d\d\-\d\d\-\d\d$
      examples:
        - '1947-02-01'
    VisaADAliasId:
      description: The UUID generated by Alias Directory which identifies the alias.
      type: string
      minLength: 36
      maxLength: 36
      examples:
        - e336c8c8-2945-4be3-af3e-951ec2d01219
    VisaADAliasUpdatingStatus:
      description: The updating status of an alias.
      type: string
      enum:
        - ACTIVE
        - DISABLED
      examples:
        - ACTIVE
    VisaADAliasStatus:
      description: The status of an alias.
      type: string
      enum:
        - ACTIVE
        - DISABLED
        - BLOCKED
        - EXPIRED
      examples:
        - ACTIVE
    VisaADAliasType:
      description: The type of alias provided in aliasValue.
      type: string
      enum:
        - PHONE
        - EMAIL
      examples:
        - PHONE
    VisaADAliasValue:
      description: >
        The value of the alias, e.g., phone number or email address. 

        If phone number is used for alias, this should be provided in accordance
        with ITU-T E.164 (2010) number structure. 

        Please note that in the E.164 format, the "+" prefix or leading zeros
        are not included.
      type: string
      minLength: 1
      maxLength: 128
      examples:
        - '41791112233'
    VisaADProfile:
      description: Profile details for the customer that owns the alias.
      type: object
      required:
        - firstName
        - lastName
      properties:
        lastName:
          description: >
            Last name in English. Clients in CEMEA and the EU must use only one
            first letter of customer’s last name followed by dot symbol to
            create or modify an Alias record.

            For example, Alias record for customer John Smith should be created
            or modified by the issuer with First and Last name fields as 'John
            S.'


            ISO20022 element name: Creditor -> Name
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - R.
        firstName:
          description: |
            First name in English

            ISO20022 element name: Creditor -> Name
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - Hans
        middleName:
          description: Middle name in English
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - Ruedi
        contactInfo:
          description: Contact information.
          minItems: 1
          maxItems: 2
          type: array
          items:
            type: object
            required:
              - type
              - value
            properties:
              type:
                $ref: '#/components/schemas/VisaADAliasType'
              value:
                $ref: '#/components/schemas/VisaADAliasValue'
        dateOfBirth:
          $ref: '#/components/schemas/VisaADDateOfBirth'
        lastNameLocal:
          description: >
            Last name in local language. Clients in CEMEA and the EU must use
            only one first letter of customer’s last name followed by dot symbol
            to create or modify an Alias record. 

            For example, Alias record for customer John Smith should be created
            or modified by the issuer with First and Last name fields as 'John
            S.'
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - R.
        preferredName:
          description: Preferred name (or the 'known-as' name).
          type: string
          examples:
            - Hansruedi
        firstNameLocal:
          description: First name in local language.
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - Hans
        middleNameLocal:
          description: Middle name in local language.
          type: string
          minLength: 1
          maxLength: 35
          examples:
            - Ruedi
    MailerTextCode:
      description: >-
        Reference to a predefined text container that will be printed on the
        datamailer.
      type: integer
      format: int32
    CardMailerText:
      description: >-
        Text which will be printed on the letter onto which the card is
        attached.
      type: string
      minLength: 1
      maxLength: 60
