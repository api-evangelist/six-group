            - 2
        pinRecoveryStatus:
          $ref: '#/components/schemas/PinRecoveryStatus'
        markedAsDelayedDelete:
          description: Flag indicating card is scheduled for delayed deletion.
          type: boolean
        transactionAuthorizer:
          $ref: '#/components/schemas/TransactionAuthorizer'
        cardOrderDateTime:
          description: Datetime when the card was ordered.
          type: string
          format: date-time
          examples:
            - '2024-04-13T08:30:00Z'
    OnlineLimits:
      description: The monthly and daily retail and cash transactions limits.
      type: object
      required:
        - totalLimitPerMonth
        - cashLimitPerMonth
        - totalLimitPerDay
        - cashLimitPerDay
      properties:
        totalLimitPerMonth:
          description: >-
            Total limit per month for retail and money in cash transactions in
            whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
            - 20000
        cashLimitPerMonth:
          description: >-
            Limit per month for money in cash transactions in whole Swiss
            Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
            - 10000
        totalLimitPerDay:
          description: >-
            Total limit per day for retail and money in cash transactions in
            whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
            - 5000
        cashLimitPerDay:
          description: Limit per day for money in cash transactions in whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
            - 1000
    BccData:
      description: Information about the cardholder from the bank card central.
      type: object
      required:
        - salutation
        - firstName
        - familyName
        - street
        - city
        - postalCode
        - country
      properties:
        salutation:
          $ref: '#/components/schemas/Salutation'
        firstName:
          $ref: '#/components/schemas/FirstName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        street:
          description: Street name.
          type: string
          maxLength: 25
          examples:
            - Bahnhofstrasse
        streetNo:
          description: Street number.
          type: string
          maxLength: 5
          examples:
            - '1'
        city:
          description: Location city.
          type: string
          maxLength: 25
          examples:
            - Zürich
        postalCode:
          description: Postal code.
          type: string
          maxLength: 10
          examples:
            - '8001'
        country:
          $ref: '#/components/schemas/Country'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        birthdate:
          description: Birthdate to identify the customer.
          type: string
          format: date
          examples:
            - '2000-12-31'
        emailAddress:
          description: Email address to identify the customer.
          type: string
          examples:
            - peter.schweizer@mailbox.org
        customerRelationshipOpeningDate:
          description: >-
            Date when the customer relationship was opened; used to identify the
            customer.
          type: string
          format: date
          examples:
            - '2021-12-31'
        accountOpeningDate:
          description: Date when the account was opened; used to identify the customer.
          type: string
          format: date
          examples:
            - '2021-12-31'
        accountAuthorities:
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/AccountAuthority'
        individualIdentificationTag:
          description: Individual tag to identify the customer.
          type: string
          maxLength: 80
          examples:
            - Owner of a sailing boat
        ebankingContractNo:
          description: Ebanking contract number to identify the customer.
          type: string
          maxLength: 15
          examples:
            - ABC-56789012345
    Salutation:
      description: Salutation code of a cardholder.
      type: string
      enum:
        - NOT_SET
        - MR
        - MS
        - FIRM
    TransactionAuthorizer:
      type: string
      description: Authorizer for retail and ATM transactions.
      enum:
        - ALWAYS_SIX
        - ISSUER_WITH_FALLBACK_SIX
        - SIX_WITH_FALLBACK_ISSUER
        - ISSUER_WITH_FALLBACK_SIX_AND_OTHER_LIMITS
    CardExpressCode:
      description: >-
        Defines the express code of the card delivery. Must be set for a
        physical card order and CardDelivery is DELIVER_TO_CARDHOLDER.
      type: string
      enum:
        - A_POST
        - B_POST
        - REGISTERED
        - COURIER
    FraudConfiguration:
      description: >-
        The fraud configuration, containing restrictions for countries and
        regions. Authorizations from a country will be declined if the country
        itself, or the region it belongs to, is restricted.
      type: object
      properties:
        restrictedRegions:
          $ref: '#/components/schemas/RestrictedRegions'
        restrictedCountries:
          $ref: '#/components/schemas/RestrictedCountries'
        riskShieldListing:
          description: >-
            A list of monitoring lists in RiskShield on which a card can be
            listed. Deprecated and ignored in card order requests.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RiskShieldList'
    Region:
      description: Region from where an authorization is requested.
      type: string
      enum:
        - SWITZERLAND_AND_LIECHTENSTEIN
        - EUROPE
        - EASTERN_EUROPE_AND_CENTRAL_ASIA
        - AFRICA
        - CANADA
        - USA_AND_MEXICO
        - LATIN_AMERICA_AND_CARIBBEAN
        - MIDDLE_EAST_ASIA_PACIFIC_AUSTRALIA
    Country:
      description: Country code in format ISO 3166-1 alpha 2.
      type: string
      pattern: '[A-Z]{2}'
      examples:
        - CH
    RiskShieldList:
      description: >-
        - "EXCLUSION_LIST": General whitelist, i.e. all rules that lead to
        RiskShield declines and automatic blockings are overridden.

        - "GREY_LIST_CNP": The non-secure card not present transactions are
        declined.

        - "GREY_LIST_F2F": Card present transactions are declined.

        - "INTERNAL_DECLINE_LIST": General blacklist, i.e. the transactions are
        declined.

        - "MONITORED_CARDS_LIST": For card present transactions an alert is
        generated.

        - "RULE_WHITE_CARD_LIST": Certain rules for cards are disabled, i.e. no
        transactions are declined and no alerts generated.
      type: string
    UnstructuredAddress:
      description: Unstructured address of simple address lines.
      type: array
      minItems: 1
      maxItems: 6
      items:
        type: string
        maxLength: 35
      examples:
        - - Peter Schweizer
          - Bahnhofstrasse 1
          - 8000 Zürich
    FeatureToggles:
      description: >-
        Contains the values of the feature toggles for the card. In card order
        requests, the contactlessActivationStatus will be ignored. Will be
        ignored in card order requests for bank cards.
      type: object
      required:
        - eCommerceAllowed
        - trxOnlyAsChipAndPin
        - magStripePaymentAllowed
        - automaticBilling
        - purchaseWithCashBackAllowed
        - merchantInitiatedTrxAllowed
        - atmAllowed
        - posAllowed
        - motoAllowed
        - bypassGeoblocking
        - moneySendReceiveAllowance
        - reservationAllowed
        - transactionPushEnabled
        - gamblingAndBettingAllowance
      properties:
        eCommerceAllowed:
          description: Indicates if the use of ecommerce is allowed.
          type: boolean
        trxOnlyAsChipAndPin:
          description: >-
            Indicates if cvm is active, i.e. card can do transaction only as
            Chip and PIN.
          type: boolean
        magStripePaymentAllowed:
          description: Defines if magnetic stripe payments are allowed.
          type: boolean
        automaticBilling:
          description: >-
            Indicates if the cardholder participates to the automatic billing
            update.
          type: boolean
        purchaseWithCashBackAllowed:
          description: Defines if purchase with cash back is allowed.
          type: boolean
        blockedMerchantCategoryCodes:
          description: List of blocked merchant category codes.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/MerchantCategoryCode'
        merchantInitiatedTrxAllowed:
          description: >-
            Indicates if merchant initiated transactions - such as Recurring,
            Installment, Unscheduled - are allowed.
          type: boolean
        atmAllowed:
          description: Defines if withdrawals are allowed at ATMs.
          type: boolean
        posAllowed:
          description: Defines if payments are allowed at POS terminals.
          type: boolean
        motoAllowed:
          description: Defines if mail or phone orders are allowed.
          type: boolean
        bypassGeoblocking:
          description: Defines if geo blocking is ignored for the card.
          type: boolean
        moneySendReceiveAllowance:
          $ref: '#/components/schemas/MoneySendReceiveAllowance'
        reservationAllowed:
          description: Defines if reservation transactions are allowed.
          type: boolean
        transactionPushEnabled:
          description: Defines if transactions are pushed to debiX.
          type: boolean
        gamblingAndBettingAllowance:
          $ref: '#/components/schemas/GamblingAndBettingAllowance'
        contactlessActivationStatus:
          $ref: '#/components/schemas/ContactlessActivationStatus'
    AuthorizationsSearchRequestFilter:
      description: >-
        Contains the filters for the authorizations search. The date range lower
        and upper bounds are inclusive.
      type: object
      properties:
        cardTokenEntension:
          $ref: '#/components/schemas/CardTokenExtension'
        walletType:
          $ref: '#/components/schemas/WalletType'
        onlyDigitalCardBased:
          description: >-
            Determines if only digital card based authorizations should be
            returned.
          type: boolean
          default: true
        transactionDateRange:
          $ref: '#/components/schemas/DateRange'
        paging:
          $ref: '#/components/schemas/Paging'
    DigitalCardAuthorizationsSearchRequestFilter:
      description: >-
        Contains the filters for the authorizations search. The date range lower
