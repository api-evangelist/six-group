        The reversal is only possible while the card order of a physical card is
        still in a cancellable state: for card renewals before 7:55 am on the
        same day as the card order request and for new card orders before 18:25
        on the same day as the card order request.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

