          description: Identifier of the alias
          required: true
          schema:
            $ref: '#/components/schemas/VisaADAliasId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisaADUpdateCardRequest'
      responses:
        '204':
          description: The alias information was successfully updated
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /visa-alias-directory/aliases/{aliasId}/cards/{cardToken}:
    get:
      operationId: retrieveCardVisaAD
      tags:
        - Alias Directory (Beta)
      summary: Retrieves a card registered in the Alias Directory.
      description: >
        Retrieves a specific card corresponding to the alias of the specified
        Alias ID.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4520 - UNKNOWN_ALIAS

        * 4522 - CARD_NOT_REGISTERED_IN_VISA_ALIAS_DIRECTORY

        * 4524 - ISSUER_NOT_CONFIGURED_FOR_VISA_ALIAS_DIRECTORY
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: aliasId
          description: Identifier of the alias
          required: true
          schema:
            $ref: '#/components/schemas/VisaADAliasId'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisaADRetrieveCardResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
    delete:
      operationId: deleteCardVisaAD
      tags:
        - Alias Directory (Beta)
      summary: Deletes a card from the Alias Directory.
      description: >
        Deletes the given card from the alias of the specified Alias ID.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4520 - UNKNOWN_ALIAS

        * 4522 - CARD_NOT_REGISTERED_IN_VISA_ALIAS_DIRECTORY

        * 4524 - ISSUER_NOT_CONFIGURED_FOR_VISA_ALIAS_DIRECTORY
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: aliasId
          description: Identifier of the alias
          required: true
          schema:
            $ref: '#/components/schemas/VisaADAliasId'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      responses:
        '204':
          description: The card was successfully deleted from the alias
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
components:
  parameters:
    RequestIdHeader:
      in: header
      name: x-request-id
      description: A unique identifier for a request and response pair.
      schema:
        type: string
    IssuerTraceIdHeader:
      in: header
      name: issuer-trace-id
      description: >-
        A issuer‑provided unique trace identifier to correlate the complete flow
        started by this request.
      schema:
        type: string
        minLength: 1
        maxLength: 26
    MerchantId:
      description: A unique identifier corresponding to a merchant in debiX.
      name: merchantId
      in: path
      required: true
      schema:
        type: string
    ImageVersionHeader:
      description: Version of the image currently stored in the client.
      name: If-None-Match
      in: header
      schema:
        type: string
  schemas:
    PushEventsSearchRequestFilter:
      description: >-
        Contains the filter for the push event search. The date range lower and
        upper bounds are inclusive.
      type: object
      properties:
        dateRange:
          $ref: '#/components/schemas/DateRange'
        pushEventTypes:
          description: List of push event types.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PushEventType'
        pushModules:
          description: List of push modules.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PushModule'
        paging:
          $ref: '#/components/schemas/Paging'
    PushEventType:
      description: |-
        Type of the push event.
        - "CARD_BLOCKED"
        - "CARD_UNBLOCKED"
        - "CARD_DELETED"
        - "TOKEN_UPDATED"
        - "TOKEN_DECLINED"
        - "AUTHORIZATION_FULFILLED"
        - "AUTHORIZATION_REJECTED"
        - "CARD_ORDERED"
        - "CARD_UPDATED"
        - "CARD_ORDER_REVERSED"
        - "PIN_ORDERED"
        - "PIN_VIEWED"
        - "ISSUE_OCCURED"
        - "CARD_SYNC"
      type: string
    PushModule:
      description: |-
        Module the push event is part of.
        - "TOKEN_LIFECYCLE"
        - "AUTHORIZATION"
        - "CARD_LIFECYCLE"
      type: string
    PushEventsSearchResponse:
      description: >-
        Contains a list of event references. The list is ordered by event
        timestamp from newest to oldest.
      type: object
      required:
        - eventReferences
      properties:
        eventReferences:
          type: array
          items:
            $ref: '#/components/schemas/PushEventReference'
        totalRecords:
          description: Total available records.
          type: integer
          format: int64
          examples:
            - 1021
    PushEventReference:
      description: Reference identifying a push event already sent to the issuer.
      type: object
      required:
        - eventId
      properties:
        eventId:
          $ref: '#/components/schemas/PushEventId'
        issuerTraceId:
          description: >-
            Issuer trace id is only available in a push event if the issuer's
            triggering request had provided an issuer trace id.
          $ref: '#/components/schemas/IssuerTraceId'
    ResendPushEventsRequest:
      description: List of references to push events that should be resent.
      type: object
      required:
        - eventIds
      properties:
        eventIds:
          type: array
          items:
            $ref: '#/components/schemas/PushEventId'
    PushEventId:
      description: Unique identifier for the push event.
      type: string
      format: uuid
    IssuerTraceId:
      description: >-
        A issuer‑provided unique trace identifier to correlate the complete
        flow.
      type: string
      minLength: 1
      maxLength: 26
    VisaC2PEnrollCustomerRequest:
      description: Customer and card data to enroll to Visa Click to Pay.
      type: object
      required:
        - customer
        - card
      properties:
        customer:
          $ref: '#/components/schemas/VisaC2PEnrollingCustomer'
        card:
          $ref: '#/components/schemas/VisaC2PCard'
    VisaC2PEnrollingCustomer:
      description: Contains the information about a customer to be enrolled.
      type: object
      required:
        - email
        - locale
        - phone
        - lastName
        - firstName
        - countryCode
        - customerId
      properties:
        email:
          $ref: '#/components/schemas/VisaC2PCustomerEmail'
        locale:
          $ref: '#/components/schemas/VisaC2PCustomerLocale'
        phone:
          $ref: '#/components/schemas/VisaC2PCustomerPhone'
        lastName:
          $ref: '#/components/schemas/VisaC2PCustomerLastName'
        firstName:
          $ref: '#/components/schemas/VisaC2PCustomerFirstName'
        middleName:
          $ref: '#/components/schemas/VisaC2PCustomerMiddleName'
        countryCode:
          $ref: '#/components/schemas/VisaC2PCustomerCountryCode'
        customerId:
          $ref: '#/components/schemas/VisaC2PCustomerId'
        nationalIdentifier:
          $ref: '#/components/schemas/VisaC2PCustomerNationalIdentifier'
    VisaC2PUpdatingCustomer:
      description: Contains the information about the customer update.
      type: object
      required:
        - email
        - locale
        - phone
        - lastName
        - firstName
        - countryCode
      properties:
        email:
          $ref: '#/components/schemas/VisaC2PCustomerEmail'
        locale:
          $ref: '#/components/schemas/VisaC2PCustomerLocale'
        phone:
          $ref: '#/components/schemas/VisaC2PCustomerPhone'
        lastName:
          $ref: '#/components/schemas/VisaC2PCustomerLastName'
        firstName:
          $ref: '#/components/schemas/VisaC2PCustomerFirstName'
        middleName:
          $ref: '#/components/schemas/VisaC2PCustomerMiddleName'
        countryCode:
          $ref: '#/components/schemas/VisaC2PCustomerCountryCode'
        customerStatus:
          $ref: '#/components/schemas/VisaC2PCustomerStatus'
        nationalIdentifier:
          $ref: '#/components/schemas/VisaC2PCustomerNationalIdentifier'
    VisaC2PCustomer:
      description: Contains the information about the customer.
      type: object
      required:
        - email
        - locale
        - phone
        - lastName
        - firstName
        - countryCode
        - customerId
      properties:
        email:
          $ref: '#/components/schemas/VisaC2PCustomerEmail'
        locale:
          $ref: '#/components/schemas/VisaC2PCustomerLocale'
        phone:
          $ref: '#/components/schemas/VisaC2PCustomerPhone'
        lastName:
          $ref: '#/components/schemas/VisaC2PCustomerLastName'
        firstName:
          $ref: '#/components/schemas/VisaC2PCustomerFirstName'
        middleName:
          $ref: '#/components/schemas/VisaC2PCustomerMiddleName'
        countryCode:
          $ref: '#/components/schemas/VisaC2PCustomerCountryCode'
        customerId:
          $ref: '#/components/schemas/VisaC2PCustomerId'
        customerStatus:
          $ref: '#/components/schemas/VisaC2PCustomerStatus'
        nationalIdentifier:
          $ref: '#/components/schemas/VisaC2PCustomerNationalIdentifier'
    VisaC2PCustomerEmail:
      description: The customer's email address.
      type: string
      minLength: 1
      maxLength: 256
      examples:
        - peter.schweizer@mailbox.org
    VisaC2PCustomerLocale:
      description: The customer's locale.
      type: string
      minLength: 2
      maxLength: 5
      examples:
        - de_CH
    VisaC2PCustomerPhone:
      description: >-
        The customer's phone number in ITU-T E.164 format, without "+" symbol
        and leading zeros.
      type: string
      minLength: 1
      maxLength: 15
      examples:
        - '41791231212'
    VisaC2PCustomerLastName:
      description: The customer's last name.
      type: string
      minLength: 1
      maxLength: 35
      examples:
        - Muster
    VisaC2PCustomerFirstName:
      description: The customer's first name.
      type: string
      minLength: 1
      maxLength: 35
      examples:
        - Maximilian
    VisaC2PCustomerMiddleName:
      description: The customer's middle name.
      type: string
      minLength: 1
      maxLength: 35
      examples:
        - Alexander
    VisaC2PCustomerCountryCode:
      description: The customer's country code in the ISO 3166 (alpha 3) format.
      type: string
      minLength: 3
      maxLength: 3
      examples:
        - CHE
    VisaC2PCustomerNationalIdentifier:
      description: The customer's national identifier.
      type: object
      required:
        - type
        - value
      properties:
        type:
          description: The type of identification.
          type: string
          enum:
            - PASSPORT
            - DRIVING_LICENSE
            - NATIONAL_IDENTITY
        value:
          description: The number of identification.
          type: string
          minLength: 1
          maxLength: 24
          examples:
            - A123456
    VisaC2PCustomerStatus:
      description: The status of the enrolled customer.
      type: string
      enum:
        - ACTIVE
        - DISABLED
    VisaC2PCard:
      description: >-
        Contains the information about the card, which must be valid when
        enrolling for Click to Pay.
      type: object
      required:
        - nameOnCard
        - billingAddress
        - cardToken
        - expiration
      properties:
        nameOnCard:
          description: The name which is printed on the card.
          type: string
          minLength: 1
          maxLength: 120
          examples:
            - Peter Schweizer
        billingAddress:
          $ref: '#/components/schemas/VisaC2PBillingAddress'
        cardToken:
          $ref: '#/components/schemas/CardToken'
        expiration:
          $ref: '#/components/schemas/YearMonth'
    VisaC2PBillingAddress:
      description: The card's billing address.
      type: object
      required:
        - city
        - countryCode
        - postalCode
        - addressLine1
      properties:
        city:
          description: The city of the billing address.
          type: string
          minLength: 1
          maxLength: 32
          examples:
            - Winterthur
        state:
          description: The state of the billing address in the ISO 3166-2 format.
          type: string
          minLength: 1
          maxLength: 3
          examples:
            - ZH
        countryCode:
          description: >-
            The country code of the billing address in the ISO 3166-1-alpha3
            format.
          type: string
          minLength: 3
          maxLength: 3
          examples:
            - CHE
        postalCode:
          description: The postal or zip code of the billing address.
          type: string
          minLength: 1
          maxLength: 9
          examples:
            - '8400'
        addressLine1:
          description: First line of the billing address.
          type: string
          minLength: 1
          maxLength: 64
          examples:
            - Musterstrasse 12
        addressLine2:
          description: Second line of the billing address.
          type: string
          minLength: 1
          maxLength: 64
        addressLine3:
          description: Third line of the billing address.
          type: string
          minLength: 1
          maxLength: 64
    VisaC2PEnrollCustomerResponse:
      description: The response to a customer enrolment request.
      type: object
      required:
        - requestTraceId
      properties:
        requestTraceId:
          $ref: '#/components/schemas/VisaC2PRequestTraceId'
    VisaC2PRequestTraceId:
      description: Identifier of the request trace.
      type: string
      format: uuid
    VisaC2PGetCustomerResponse:
      description: The response received after getting a customer's information.
      type: object
      required:
        - customer
        - enrolledCards
      properties:
        customer:
          $ref: '#/components/schemas/VisaC2PCustomer'
        enrolledCards:
          type: array
          items:
            $ref: '#/components/schemas/VisaC2PEnrolledCard'
    VisaC2PEnrolledCard:
      description: Contains all information about a card and it's enrollment information.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/VisaC2PCard'
        digitalCard:
          $ref: '#/components/schemas/VisaC2PDigitalCard'
        panReferenceId:
          description: Unique identifier for the card provided by Visa Click to Pay.
          type: string
          minLength: 1
          maxLength: 32
        paymentAccountReference:
          description: >-
            Unique payment account reference for the card provided by Visa Click
            to Pay.
          type: string
          minLength: 29
          maxLength: 50
        customerStatus:
          $ref: '#/components/schemas/VisaC2PCustomerStatus'
    VisaC2PDigitalCard:
      description: The information about the digital card created in the enrollment.
      type: object
      required:
        - tokenReferenceId
        - tokenRequestorId
      properties:
        tokenReferenceId:
          description: Identifier of the token.
          type: string
          minLength: 1
          maxLength: 50
        tokenRequestorId:
          description: Identifier of the token requestor.
          type: string
          minLength: 1
          maxLength: 11
    VisaC2PUpdateCustomerRequest:
      description: The latest information of the enrolled customer.
      type: object
      required:
        - customer
      properties:
        customer:
          $ref: '#/components/schemas/VisaC2PUpdatingCustomer'
    VisaC2PUpdateCustomerResponse:
      description: The response to a customer update request.
      type: object
      required:
        - requestTraceId
      properties:
        requestTraceId:
          $ref: '#/components/schemas/VisaC2PRequestTraceId'
    VisaC2PDeleteCustomerResponse:
      description: The response to a customer delete request.
      type: object
      required:
        - requestTraceId
      properties:
        requestTraceId:
          $ref: '#/components/schemas/VisaC2PRequestTraceId'
    VisaC2PEnrollCardRequest:
      description: The request to enroll a new card for a customer.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/VisaC2PCard'
    VisaC2PEnrollCardResponse:
      description: The response to a card enrolment request.
      type: object
      required:
        - requestTraceId
      properties:
        requestTraceId:
          $ref: '#/components/schemas/VisaC2PRequestTraceId'
    VisaC2PUpdateCardRequest:
      description: The request to update an enrolled card.
      type: object
      required:
        - card
      properties:
        card:
          $ref: '#/components/schemas/VisaC2PCard'
    VisaC2PUpdateCardResponse:
      description: The response to a card update request.
      type: object
      required:
        - requestTraceId
      properties:
        requestTraceId:
          $ref: '#/components/schemas/VisaC2PRequestTraceId'
    VisaC2PDeleteCardResponse:
      description: The response to a card deletion request.
      type: object
      required:
        - requestTraceId
      properties:
        requestTraceId:
          $ref: '#/components/schemas/VisaC2PRequestTraceId'
    VisaC2PStatusResponse:
      description: The response to a request querying the status of a performed action.
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/VisaC2PRequestStatus'
        errors:
          description: List of error details.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorDetail'
    VisaC2PRequestStatus:
      description: The current status of a previously triggered action.
      type: string
      enum:
        - IN_PROGRESS
        - SUCCESS
        - FAILURE
    VisaC2PCustomerId:
      description: Unique identifier for the customer.
      type: string
      format: uuid
    DigitalCardsSearchRequestFilter:
      description: >-
        Contains the optional filters for the digital cards search. Expiry and
        provisioning date lower and upper bounds are inclusive.
      type: object
      properties:
        wallet:
          $ref: '#/components/schemas/WalletProvider'
        tokenRequestor:
          $ref: '#/components/schemas/TokenRequestor'
        digitalCardExpiryRange:
          $ref: '#/components/schemas/YearMonthRange'
        provisioningDateTimeRange:
          $ref: '#/components/schemas/DateTimeRange'
        status:
          $ref: '#/components/schemas/DigitalCardStatus'
        paging:
          $ref: '#/components/schemas/Paging'
    AuthorizationsResponse:
      description: >-
        Contains a list of authorizations, ordered by transaction date from
        newest to oldest.
      type: object
      properties:
        authorizations:
          type: array
          items:
            $ref: '#/components/schemas/Authorization'
        totalRecords:
          description: Total available records.
          type: integer
          format: int64
          examples:
            - 1021
    AuthorizationOrigin:
      description: |-
        Origin of the authorization.
        - "ATM": ATM over shortcut
        - "ATMD": domestic ATM
        - "BM-I": international ATM
        - "EP2": retail over shortcut
        - "POSD": domestic retail
        - "POSI": international retail
      type: string
      examples:
        - ATM
    DigitalCardSearchResponse:
      description: >-
        Contains a list of digital cards corresponding to the request filter,
        sorted by provisioning date from newest to oldest.
      type: object
      properties:
        digitalCards:
          description: List of digital cards found.
          type: array
          items:
            $ref: '#/components/schemas/DigitalCard'
        totalRecords:
          description: Total available records.
          type: integer
          format: int64
          examples:
            - 1021
    DateRange:
      description: Date range lower and upper bounds (both inclusive).
      type: object
      properties:
        from:
          description: Start date (inclusive).
          type: string
          format: date
          examples:
            - '2024-01-01'
        to:
          description: End date (inclusive).
          type: string
          format: date
          examples:
            - '2024-12-31'
    DateTimeRange:
      description: Date-time range lower and upper bounds (both inclusive).
      type: object
      properties:
        from:
          description: Date-time lower bound (inclusive).
          type: string
          format: date-time
          examples:
            - '2022-01-01T00:00:00.000+02:00'
        to:
          description: Date-time upper bound (inclusive).
          type: string
          format: date-time
          examples:
            - '2022-12-31T23:59:59.999+02:00'
    YearMonthRange:
      description: Year-month range lower and upper bounds (both inclusive).
      type: object
      properties:
        from:
          $ref: '#/components/schemas/YearMonth'
        to:
          $ref: '#/components/schemas/YearMonth'
    DigitalCardsStatusUpdateRequest:
      description: Contains the new digital card status and the update reason.
      type: object
      required:
        - status
        - digitalCardStatusUpdateReason
      properties:
        status:
          $ref: '#/components/schemas/DigitalCardStatus'
        digitalCardStatusUpdateReason:
          $ref: '#/components/schemas/DigitalCardStatusUpdateReason'
    DigitalCardStatusUpdateRequest:
      description: Contains the new digital card status and the update reason.
      type: object
      required:
        - status
        - digitalCardStatusUpdateReason
      properties:
        status:
          $ref: '#/components/schemas/DigitalCardStatus'
        digitalCardStatusUpdateReason:
          $ref: '#/components/schemas/DigitalCardStatusUpdateReason'
    DigitalCardStatusUpdateResponse:
      description: >-
        Contains two lists of digital cards; one contains those for which the
        update was triggered, the other contains those for which the update is
        not possible due to business rules. Both lists are sorted in ascending
        order by the Dpan.
      type: object
      properties:
        commissionedDigitalCards:
          description: Lists of digital cards for which the update was triggered.
          type: array
          items:
            $ref: '#/components/schemas/Dpan'
        rejectedDigitalCards:
          description: >-
            Lists of digital cards for which the update is not possible due to
            business rules.
          type: array
          items:
            $ref: '#/components/schemas/RejectedDigitalCard'
    PresentmentsSearchRequestFilter:
      description: >-
        Contains the filters for the presentments search. The date range lower
        and upper bounds are inclusive.
      type: object
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        walletType:
          $ref: '#/components/schemas/WalletType'
        transactionDateRange:
          $ref: '#/components/schemas/DateRange'
        paging:
          $ref: '#/components/schemas/Paging'
    PresentmentsResponse:
      description: >-
        Contains a list of presentments, ordered by transaction date from newest
        to oldest.
      type: object
      properties:
        presentments:
          type: array
          items:
            $ref: '#/components/schemas/Presentment'
        totalRecords:
          description: Total available records.
          type: integer
          format: int64
          examples:
            - 1021
    HealthCheckRequest:
      type: object
      required:
        - message
      properties:
        message:
          description: Expected response message from health check.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - Any string
    HealthCheckResponse:
      type: object
      required:
        - message
        - requestDateTime
        - receivedHeaders
        - apiVersion
      properties:
        message:
          description: Response message from health check.
          type: string
          minLength: 1
          maxLength: 100
          examples:
            - >-
              The healthcheck GET request was successfully received and
              processed.
        requestDateTime:
          description: Date and time of the request.
          type: string
          format: date-time
          examples:
            - '2021-10-03T16:03:09.101+02:00'
        receivedHeaders:
          description: The headers received by the api backend.
          type: array
          items:
            $ref: '#/components/schemas/ReceivedHeader'
        apiVersion:
          description: Version of this API.
          type: string
          examples:
            - 1.0.0
    ReceivedHeader:
      type: object
      properties:
        headerName:
          description: Name of the received header.
          type: string
          examples:
            - x-correlation-id
        headerValue:
          description: Value of the received header.
          type: string
          examples:
            - 9bcd4351-4b7b-4017-9b63-9613414c6ff1
    Paging:
      description: Contains paging properties.
      type: object
      properties:
        pageNumber:
          description: Page number for paging starting with zero.
          type: integer
          format: int32
          default: 0
          examples:
            - 0
        pageSize:
          description: Limitation of the page size.
          type: integer
          format: int32
          minimum: 20
          maximum: 100
          default: 100
          examples:
            - 50
    Authorization:
      description: Authorization notification.
      type: object
      required:
        - processingType
        - transactionDateTime
        - transactionClass
        - transactionType
        - authorizationOrigin
        - useCase
        - cardAcceptor
        - cardToken
        - cardTokenExtension
      properties:
        id:
          $ref: '#/components/schemas/TransactionId'
        processingType:
          description: |-
            - 0: Normal Trx/Presentment
            - 1: Representment
            - 2: Reversal/Storno
            - 3: Reversal of Representment
            - 4: Chargeback
            - 5: Reversal of Chargeback
            - 6: Partial Reversal
            - 7: Partial Chargeback
            - 8: Partial Representment
          type: integer
          format: int32
        dpan:
          $ref: '#/components/schemas/Dpan'
        schemeTransactionId:
          $ref: '#/components/schemas/SchemeTransactionId'
        approvalCode:
          $ref: '#/components/schemas/ApprovalCode'
        walletType:
          $ref: '#/components/schemas/WalletType'
        transactionDateTime:
          description: Date and time of the transaction.
          type: string
          format: date-time
          examples:
            - '2021-10-03T16:03:09.101+02:00'
        issuerResponseCode:
          description: Internal response code of SPS Issuing Frontoffice.
          type: integer
          format: int32
          examples:
            - 2103
        transactionState:
          description: >-
            - 0: Transaction purpose fulfilled, service performed

            - 1: Transaction purpose not fulfilled, for technical reasons, e.g.
            timeout

            - 2: Transaction purpose not fulfilled, for other reasons, e.g.
            incorrect PIN
          type: integer
          format: int32
        transactionClass:
          description: |-
            - 0: Authorisation & Capture
            - 1: Capture only
            - 2: Authorisation only
            - 3: Advice
            - 4: Authorisation & Capture (Clearing already done)
            - 5: Capture only (Clearing already done)
            - 9: Other
          type: integer
          format: int32
        transactionType:
          description: |-
            - 100: Cash withdrawal
            - 101: Retail purchase
            - 102: Credit
            - 103: ATM operator refund
            - 109: Deposit (ATM)
            - 117: P2P funding/debit transaction with IBAN
            - 118: P2P unload/credit with IBAN
            - 120: Balance query
            - 121: PIN change
            - 122: Check PIN/Amount/Blocking
            - 123: Check PIN/Blocking
            - 124: Check PIN
            - 125: Check Blocking
            - 127: PIN unblock
            - 128: EMV R script result advice
            - 130: Data capture after reservation
            - 132: Data capture mail order
            - 133: Data capture phone order
            - 136: Cash advance
            - 140: Reservation
            - 141: Reservation increase
            - 142: Authorization
            - 152: Recurring Authorization
            - 158: Purchase with Cashback
            - 160: Prepaid Mobile
            - 176: POS preauthorization
            - 189: P2P Payment
            - 194: Account verification
            - 197: P2P Funding
            - 212: Funding
            - 217: international POS preauthorization
            - 218: international POS preauthorization capture
            - 400: ATM card verification
            - 401: ATM account statements
            - 402: ATM inquiry exchange rate withdrawal
            - 403: ATM exchange rate deposit
            - 406: ATM inquiry general deposit data
            - 901: Normal topup transaction
          type: integer
          format: int32
          minimum: 0
          maximum: 999
          examples:
            - 101
        authorizationOrigin:
          $ref: '#/components/schemas/AuthorizationOrigin'
        useCase:
          description: |-
            - 1  cash_withdrawal_atm
            - 4  mobile_voucher_atm
            - 5  balance_inquiry
            - 6  pin_check
            - 8  purchase_of_goods
            - 9  offline_purchase_of_goods
            - 10 preauthorization
            - 14 credit
            - 15 cash_advance
            - 19 atm_foreign_withdrawal
            - 20 foreign_purchase_of_goods
            - 21 foreign_cash_advance
            - 22 foreign_credit
            - 23 foreign_purchase_with_cashback
            - 24 payment_transaction
            - 26 foreign_preauthorization
            - 27 foreign_offline_purchase_of_goods
            - 29 international_pos_account_status_inquiry
            - 30 international_blocking_advice
            - 32 atm_operator_refund
            - 37 purchase_with_cash_back
            - 40 pin_change
            - 42 emv_script_confirmation
            - 43 card_verification_atm
            - 44 reservation
            - 45 foreign_reservation
            - 49 globaldepositdata
            - 51 notes_deposit
            - 52 coins_deposit
            - 53 pos_reservation_increase
          type: integer
          format: int32
        authorizationExpiryDate:
          description: The last date (inclusive) on which the authorization is valid.
          type: string
          format: date
          examples:
            - '2021-10-03'
        amount:
          $ref: '#/components/schemas/Amount'
        cardholderAmount:
          $ref: '#/components/schemas/Amount'
        cardAcceptor:
          $ref: '#/components/schemas/CardAcceptor'
        merchant:
          $ref: '#/components/schemas/Merchant'
        cardholderAuthentication:
          description: >-
            - 0: n/a – not applicable (unknown)

            - 1: PBT (PIN Based Trx)

            - 2: no CVM (no Cardholder Verification Method)

            - 4: Mail/Telephone or electronic Commerce without authentication

            - 5: SBT (Signature Based Trx)

            - 6: e-commerce Transaction authenticated by cardholder certificate

            - 7: e-commerce Transaction authenticated by chip crypto (cardholder
            certificate not used)

            - 8: in-app or mobile eCom trx authenticated
          type: integer
          format: int32
        retrievalReference:
          $ref: '#/components/schemas/RetrievalReference'
        acquiringInstitutionId:
          description: Scheme's acquiring institution id.
          type: integer
          format: int64
          minimum: 0
          maximum: 99999999999
          examples:
            - 13445
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        cardDataSource:
          description: Code that indicates where the card data originates from.
          type: integer
          format: int32
          minimum: 0
          maximum: 99
          examples:
            - 1
        threeDsAuthenticationLevel:
          description: |-
            - 2140: 3DS Authentication OTP SMS
            - 2141: 3DS Authentication TA
            - 2142: 3DS Authentication OOB
            - 2143: 3DS Authentication PWD
            - 2144: 3DS Authentication Frictionless
          type: integer
          format: int32
        threeDsIndicator:
          $ref: '#/components/schemas/ThreeDsIndicator'
        isoResponseCode:
          description: Response code sent to the scheme in the authorization response.
          type: string
    ApplePayCardEncryptionRequest:
      description: Contains data for the Apple Pay card encryption.
      type: object
      required:
        - cardTokenExtension
        - cardholderName
        - nonce
        - nonceSignature
        - applePublicCertificates
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        cardholderName:
          $ref: '#/components/schemas/CardHolderName'
        nonce:
          type: string
          description: Nonce, passed back in the response.
        nonceSignature:
          type: string
          description: Nonce signature, passed back in the response.
        applePublicCertificates:
          type: array
          description: >-
            Apple's certificates to be used in the Diffie-Hellman key exchange.
            Base64 encoded DER certificate chain.
          items:
            type: string
            description: Base64 encoded DER certificate.
    ApplePayProvisioningResponse:
      description: Data required for push provisioning with a Apple Pay wallet.
      type: object
      required:
        - activationData
        - ephemeralPublicKey
        - encryptedData
      properties:
        activationData:
          description: base64 encoded tokenization authentication value.
          type: string
          examples:
            - >-
              for Mastercard see
              '#/components/schemas/MastercardTokenizationAuthenticationValue'
        ephemeralPublicKey:
          type: string
          description: >-
            debiX's ephemeral public key used in the Diffie-Hellman key
            exchange.
        encryptedData:
          type: string
          description: Encrypted card data, base64 encoded
          examples:
            - see '#/components/schemas/ApplePayCardCredentials'
    MastercardTokenizationAuthenticationValue:
      description: >-
        Tokenization Authentication Value for Mastercard push provisioning. The
        json is then base64 encoded.
      type: object
      required:
        - version
        - keyAlias
        - includedFieldsInOrder
        - dataValidUntilTimestamp
        - signatureAlgorithm
        - signature
      properties:
        version:
          type: string
          description: TAV version
        keyAlias:
          type: string
          description: >-
            Key alias of the key that is used to generate the signature. This
            must be the same as what was configured through the MDES Manager.
        includedFieldsInOrder:
          type: string
          description: >-
            fields that are used to build this TAV:
            dataValidUntilTimestamp|accountNumber|accountExpiry
        dataValidUntilTimestamp:
          type: string
          description: >-
            ISO 8601 format of the date and time with time zone that the TAV
            expires and is no longer honored. Include this time stamp field,
            otherwise the TAV validation fails. Note: Millisecond is not
            supported for this parameter.
          examples:
            - '2023-03-03T16:10:59Z'
        signatureAlgorithm:
          type: string
          description: Algorithm used for signature generation. RSA-SHA256 or RSA-SHA512
        signature:
          type: string
          description: >-
            Data, as specified in includedFieldsInOrder e.g.
            2018-07-3T16:10:59Z|5432123443211234|1224, is signed with the
            referenced key of keyAlias. The signature is base64 encoded.
    ApplePayCardCredentials:
      description: Card credentials used for Apple Pay push provisioning.
      type: object
      required:
        - primaryAccountNumber
        - expiration
        - name
        - nonce
        - nonceSignature
        - productType
        - version
      properties:
        primaryAccountNumber:
          type: string
          description: PAN of the card to be provisioned.
        expiration:
          type: string
          description: Expiration data of the card to be provisioned.
          pattern: ^(0[1-9]|1[0-2])/([0-9]{2})$
          examples:
            - 11/18
        name:
          type: string
          description: Cardholder name.
        nonce:
          type: string
          description: Nonce from the request.
        nonceSignature:
          type: string
          description: Nonce signature from the request.
        productType:
          type: string
          description: Always DEFAULT_MASTERCARD
        version:
          type: string
          description: Version of the credential format, always 1.
    GooglePayCardEncryptionRequest:
      description: Contains data for the Google Pay card encryption.
