      properties:
        action:
          $ref: '#/components/schemas/UpdateCardStatusAction'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        cardStatusUpdateReason:
          $ref: '#/components/schemas/CardStatusUpdateReason'
        cardBlockReason:
          $ref: '#/components/schemas/CardBlockReason'
          description: >-
            The reason why the card was blocked. Note: cardBlockReason is a
            mandatory parameter which must be provided when action = BLOCK.
        cardBlockOrigin:
          $ref: '#/components/schemas/CardBlockOriginViaBank'
        blockedCardReplacement:
          $ref: '#/components/schemas/BlockedCardReplacement'
    ClickToPayStatusRequest:
      description: Contains the email address for which to return the DPAN.
      type: object
      required:
        - emailAddress
      properties:
        emailAddress:
          $ref: '#/components/schemas/EmailAddress'
    ClickToPayStatusResponse:
