openapi: 3.1.0
info:
  title: debiX API
  version: 2.36.0
servers:
  - url: https://api.six-group.com/api/debix/bank/cardtoken/v2
    description: PROD - Internet
  - url: https://api-preprod.np.six-group.com/api/debix/bank/cardtoken/v2
    description: TEST - Internet
  - url: https://api.six.ssfn.ch/api/debix/bank/cardtoken/v2
    description: PROD - SSFN
  - url: https://api-preprod.np.six.ssfn.ch/api/debix/bank/cardtoken/v2
    description: TEST - SSFN
  - url: https://api.p2p.six-group.com/api/debix/bank/cardtoken/v2
    description: PROD - P2P
  - url: https://api-preprod.np.p2p.six-group.com/api/debix/bank/cardtoken/v2
    description: TEST - P2P
tags:
  - name: Card Management
    description: Allows card lifecycle, PIN management, retrieval of sensitive card data.
  - name: Card Usage
    description: >-
      Retrieves not expired transactions of the last 120 days for cards and
      digital cards, and merchant logo for transactions.
  - name: 3DS
    description: 3DS lifecycle, 3DS details, OTRC order.
  - name: Token Provisioning
    description: >-
      Allows provisioning wallet encryption for Mastercard push provisioning
      (Beta), provisioning wallet encryption via Thales SDK, provisioning C2P
      encryption via Thales SDK, enrollment for Mastercard Click to Pay (Beta),
      enrollment for Visa Click to Pay (Beta).
  - name: Token Lifecycle Management
    description: Retrieves and manages digital cards (tokens) for cards.
  - name: Click to Pay Issuer Offered
    description: >-
      Visa Click to Pay Issuer Offered operations to enroll and manage cards for
      Visa Click to Pay.
  - name: Alias Directory (Beta)
    description: >-
      Visa Alias Directory related operations. Feature under development,
      subject to change.
  - name: debiX PUSH Management (Beta)
    description: Allows management of debiX PUSH.
  - name: Health Check
    description: >-
      Allows to verify the availability of the API, the access to it across all
      layers, as well as the client authentication.
  - name: Deprecated
    description: Deprecated endpoints.
security: []
paths:
  /healthcheck:
    get:
      tags:
        - Health Check
      summary: Health check using GET method.
      description: Returns a status message of the system.
      operationId: healthcheckForGet
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
    post:
      tags:
        - Health Check
      summary: Health check using POST method.
      description: Returns the request body. This operation will not modify the system.
      operationId: healthCheckForPost
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
      requestBody:
        description: Any message which is expected in the response.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthCheckRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
    put:
      tags:
        - Health Check
      summary: Health check using PUT method.
      description: Returns the request body. This operation will not modify the system.
      operationId: healthCheckForPut
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
      requestBody:
        description: Any message which is expected in the response.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthCheckRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards:
    post:
      tags:
        - Card Management
      summary: Orders a new card.
      description: >
        Orders a new virtual or physical card optionally with a reference to an
        existing parent card.


        In case the feature toggle values are not specified in the request,
        either directly, or by referencing a parentCard with the
        takeoverFeatureToggles set to true, the 

        feature toggles will receive the following default values:

        | Feature Flag                 | Default Value            |

        |------------------------------|--------------------------|

        | eCommerceAllowed             | true                     |

        | trxOnlyAsChipAndPin          | false                    |

        | magStripePaymentAllowed      | true                     |

        | automaticBilling             | true                     |

        | purchaseWithCashBackAllowed  | true                     |

        | merchantInitiatedTrxAllowed  | true                     |

        | atmAllowed                   | true                     |

        | posAllowed                   | true                     |

        | motoAllowed                  | true                     |

        | bypassGeoblocking            | true                     |

        | moneySendReceiveAllowance    | RECEIVE_AND_SEND_ALLOWED |

        | reservationAllowed           | true                     |

        | transactionPushEnabled       | true                     |

        | gamblingAndBettingAllowance  | ALLOWED                  |

        | blockedMerchantCategoryCodes | (empty List)             |

        | contactlessActivationStatus  | ACTIVATED_CONFIRMED      |        


        In addition to standard application error codes, the following codes can
        be returned:

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4443 - UNKNOWN_PARENT_CARD

        * 4444 - VIRTUAL_CARD_EQUALS_PARENT_CARD

        * 4445 - CARD_ALREADY_EXISTING

        * 4446 - DELIVERY_INFORMATION_FOR_OTRC_MISSING

        * 4451 - INVALID_JWS_SIGNATURE

        * 4452 - START_SET_PIN_NOT_CALLED

        * 4462 - DELIVERY_INFORMATION_FOR_CARD_OR_PIN_MISSING

        * 4463 - CARD_EXPRESS_CODE_MISSING

        * 4464 - PIN_EXPRESS_CODE_MISSING

        * 4465 - PRODUCER_CODE_MISSING

        * 4466 - CARDLINE1_MISSING

        * 4469 - PIN_DELIVERY_NOT_ALLOWED_FOR_VIRTUAL_CARD

        * 4476 - DATAMAILER_DELIVERY_DESTINATION_DIFFERENCE_NOT_ALLOWED

        * 4477 - DATAMAILER_EXPRESS_CODE_DIFFERENCE_NOT_ALLOWED

        * 4478 - OTRC_EXPRESS_CODE_MISSING

        * 4480 - BANK_CARD_CAN_NOT_BE_ORDERED_AS_VIRTUAL_CARD

        * 4481 - PARAMETER_ONLY_ALLOWED_FOR_BANK_CARD

        * 4482 - BANK_DATA_TRACK_2_MISSING

        * 4484 - BANK_CARDS_NOT_SUPPORTED_BY_ISSUER
      operationId: orderCard
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
      requestBody:
        description: Configuration specifying the new card to be ordered.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardOrderRequest'
        required: true
      responses:
        '202':
          description: >
            Accepted. The request to order a new card has been successfully
            received and processed.

            The new card is ready for immediate use in subsequent card-related
            operations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardOrderResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/sync:
    post:
      tags:
        - debiX PUSH Management (Beta)
      summary: Triggers a synchronization of cards via debiX PUSH.
      description: >
        The current state of the cards matching the provided filter criteria are
        send via debiX PUSH to the bank. The filter may not select more than
        150'000 cards. 


        In addition to standard application error codes, the following codes can
        be returned:

        * 4525 - TOO_MANY_RESULTS

        * 4484 - BANK_CARDS_NOT_SUPPORTED_BY_ISSUER
      operationId: synchronizeCards
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
      requestBody:
        description: Optional filter criteria to define which cards should be synchronized.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardSynchronizationRequest'
        required: false
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/clicktopay/mastercard/provisioning:
    post:
      tags:
        - Token Provisioning
      summary: Enrolls a card in Mastercard Click to Pay.
      description: >
        Enrolls a card in Mastercard Click to Pay. As part of the request
        processing, a digital card will be generated for the enrolled card.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD        

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4507 - C2P_AMBIGUOUS_CONSUMER_IDENTITY_PHONE_NUMBER

        * 4508 - C2P_AMBIGUOUS_CONSUMER_IDENTITY_EMAIL_ADDRESS

        * 4509 - C2P_PARAMETER_VALIDATION_FAILED_AT_SCHEME

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: setClickToPayMastercardProvisioningData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickToPayMastercardProvisioningRequest'
        required: true
      responses:
        '204':
          description: Click to Pay provisioning was successful
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/clicktopay/visa/provisioning:
    post:
      tags:
        - Token Provisioning
      summary: Enrolls a card in Visa Click to Pay.
      description: >
        Enrolls a card in Visa Click to Pay. As part of the request processing,
        a digital card will be generated for the enrolled card.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD        

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: setClickToPayVisaProvisioningData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickToPayVisaProvisioningRequest'
        required: true
      responses:
        '204':
          description: Click to Pay provisioning was successful
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/apple-pay/provisioning-data:
    post:
      tags:
        - Token Provisioning
      summary: Get data for push provisioning of the given card to a Apple Pay wallet.
      description: >
        Returns the encrypted card data for the provisioning of a funding debit
        card, specified by its card token, into an Apple Pay wallet.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4454 - EXCLUDED_WALLET_PROVIDER

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getApplePayProvisioningData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplePayCardEncryptionRequest'
        required: true
      responses:
        '200':
          description: Successful
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplePayProvisioningResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/google-pay/provisioning-data:
    post:
      tags:
        - Token Provisioning
      summary: Get data for push provisioning of the given card to a Google Pay wallet.
      description: >
        Returns the encrypted card data for the provisioning of a funding debit
        card, specified by its card token, into a Google Pay wallet.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4454 - EXCLUDED_WALLET_PROVIDER

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getGooglePayProvisioningData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GooglePayCardEncryptionRequest'
      responses:
        '200':
          description: Successful
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GooglePayProvisioningResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/samsung-pay/provisioning-data:
    post:
      tags:
        - Token Provisioning
      summary: >-
        Get data for push provisioning of the given card to a Samsung Pay
        wallet.
      description: >
        Returns the encrypted card data for the provisioning of a funding debit
        card, specified by its card token, into a Samsung Pay wallet.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4454 - EXCLUDED_WALLET_PROVIDER

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getSamsungPayProvisioningData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SamsungPayCardEncryptionRequest'
      responses:
        '200':
          description: Successful
          headers:
            X-Request-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SamsungPayProvisioningResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/encrypt-card-data:
    post:
      tags:
        - Token Provisioning
        - Deprecated
      summary: Returns encrypted card data.
      description: >
        Deprecated, use one of `POST
        /cards/{cardToken}/apple-pay/provisioning-data`, 

        `POST /cards/{cardToken}/google-pay/provisioning-data`, 

        `POST /cards/{cardToken}/samsung-pay/provisioning-data` instead.


        Returns the encrypted card data for the provisioning of a funding debit
        card, specified by its card token, into a wallet with Thales SDK.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getEncryptedCardData
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        description: Card data to encrypt.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardEncryptionRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardEncryptionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/encrypt-card-data/click-to-pay:
    post:
      tags:
        - Token Provisioning
      summary: Returns encrypted card data for Click to Pay.
      description: >
        Returns the encrypted card data for the provisioning of a funding debit
        card for Click to Pay into a wallet with Thales SDK.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4460 - ECOMMERCE_FEATURE_TOGGLE_NOT_ACTIVATED

        * 4461 - INCOMPLETE_OR_MISSING_ADDRESS_DATA

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getEncryptedCardDataClickToPay
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        description: Card data to encrypt.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickToPayCardEncryptionRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClickToPayCardEncryptionResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/click-to-pay/status:
    post:
      tags:
        - Token Provisioning
      summary: Checks for existing Click to Pay registrations.
      description: >
        Returns the DPAN associated with the given card and email address for
        Click to Pay. Will return no DPAN if no association exists.


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getClickToPayStatus
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        description: Email address for which to return the registered DPAN.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClickToPayStatusRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClickToPayStatusResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Card not found or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/{cardToken}/generate-authorization-code:
    post:
      tags:
        - Token Provisioning
      summary: Returns an authorization code.
      description: >
        Returns an authorization code for the provisioning of a funding debit
        card, specified by its card token, into a wallet with Thales SDK. 

        The code is valid for 20 seconds in the production environment and 60
        seconds in test environment.  


        In addition to standard application error codes, the following codes can
        be returned:

        * 4430 - UNKNOWN_CARD

        * 4432 - BANK_CLEARING_NUMBER_NOT_CONFIGURED

        * 4433 - UNKNOWN_WALLET_PROVIDER

        * 4436 - CARD_INACTIVE

        * 4449 - TOKENIZATION_NOT_SUPPORTED

        * 4454 - EXCLUDED_WALLET_PROVIDER

        * 4483 - OPERATION_NOT_ALLOWED_FOR_BANK_CARD
      operationId: getAuthorizationCode
      parameters:
        - $ref: '#/components/parameters/RequestIdHeader'
        - $ref: '#/components/parameters/IssuerTraceIdHeader'
        - in: path
          name: cardToken
          description: Card token
          required: true
          schema:
            $ref: '#/components/schemas/CardToken'
      requestBody:
        description: >-
          Card identifier and wallet for the generation of the authorization
          code.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeRequest'
        required: true
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationCodeResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
