        otrcStatus:
          description: Shows the OTRC status
          type: string
          enum:
            - DISABLED
            - ENABLED
            - LOCKED
          examples:
            - DISABLED
        otrcValidity:
          description: Date and time of the OTRC expiry.
          type: string
          format: date-time
          examples:
            - '2021-10-03T16:03:09.101+02:00'
    ThreeDsAuthenticationMethod:
      description: >-
        User authentication method for either 3DS via debiX Api, via debiX+ App
        or via SMS.
      type: string
      enum:
        - PIN
        - BIOMETRIC
        - BIOMETRIC_WITH_PIN_FALLBACK
        - BIOMETRIC_AND_PIN
        - DELEGATED
        - SMS_ONLY
        - NONE
    CardTokenRequest:
