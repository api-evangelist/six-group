        threeDsData:
          $ref: '#/components/schemas/ThreeDsData'
    ThreeDsUpdateRequest:
      description: Contains the 3DS-related data to be updated.
      type: object
      required:
        - threeDsData
      properties:
        threeDsData:
          $ref: '#/components/schemas/PartialThreeDsData'
    ThreeDsDetailsRequest:
      description: Identifiers of the card for which to return the 3DS details.
      type: object
      required:
        - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    ThreeDsDetailsResponse:
      description: Contains detailed information about 3DS.
      type: object
      required:
        - language
        - threeDsStatus
      properties:
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        language:
          $ref: '#/components/schemas/Language'
        userId:
          description: Identifier assigned to a particular user by the issuer.
          type: string
          minLength: 1
          examples:
            - '2345872'
        threeDsStatus:
          description: >-
            Describes if the card is active for 3DS. Will be inactive if the
            card is blocked or e-commerce is disabled.
          type: string
          enum:
            - ACTIVE
            - INACTIVE
          examples:
            - ACTIVE
        threeDsRegistrationDateTime:
          description: Date and time of the 3DS registration.
          type: string
