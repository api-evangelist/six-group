            - issuerCardRefId
            - fpan
            - exp
            - cardholderName
            - postalAddress
            - phoneNumber
            - phoneNumberCountryCode
            - email
            - issuerClientInformation
          type: string
        scheme:
          $ref: '#/components/schemas/Scheme'
        publicKeyId:
          description: Id of the public key used to encrypt the card data
          type: string
          examples:
            - tshKid
        tokenRequestorId:
          description: The Click to Pay token requestor id.
          type: string
          examples:
            - '40010075338'
    AuthorizationCodeRequest:
      description: >-
        Contains the card identifiers and wallet for the generation of the
        authorization code.
      type: object
      required:
        - cardTokenExtension
        - wallet
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        wallet:
          $ref: '#/components/schemas/WalletProvider'
    AuthorizationCodeResponse:
      description: >-
        Contains the authorization code for the provisioning of a card into a
        wallet with Thales SDK.
      type: object
      required:
        - authorizationCode
      properties:
        authorizationCode:
          description: A signed JSON Web Token (JWT/JWS) as specified by Thales SDK.
          type: string
    CardOrderRequest:
      description: Configuration specifying the new card to be ordered.
      type: object
      required:
        - cardOrderData
      properties:
        cardOrderData:
          $ref: '#/components/schemas/CardOrderData'
        parentCardReference:
          $ref: '#/components/schemas/ParentCardReference'
        bccData:
          $ref: '#/components/schemas/BccData'
        fraudConfiguration:
          $ref: '#/components/schemas/FraudConfiguration'
        isBlocked:
          description: Defines if the card is ordered blocked.
          type: boolean
          examples:
            - false
    CardOrderResponse:
      description: >
        Contains the card token and the card instance token for the newly
        created card.

        These tokens can be used immediately to perform subsequent card-related
        operations.
      type: object
      required:
        - cardToken
        - cardInstanceToken
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardInstanceToken:
          $ref: '#/components/schemas/CardInstanceToken'
    CardSynchronizationRequest:
      description: Request containing optional filter parameters for card synchronization.
      type: object
      properties:
        cardPlasticCode:
          $ref: '#/components/schemas/CardPlasticCode'
        expiry:
          $ref: '#/components/schemas/YearMonth'
        subCardType:
          $ref: '#/components/schemas/SubCardType'
        cardMaterial:
          $ref: '#/components/schemas/CardMaterial'
        cardOrderDateTimeRange:
          $ref: '#/components/schemas/DateTimeRange'
        status:
          $ref: '#/components/schemas/CardStatus'
        cardType:
          $ref: '#/components/schemas/CardType'
    PinData:
      description: Data needed to order the card with a PIN.
      type: object
      properties:
        pinDelivery:
          $ref: '#/components/schemas/PinDelivery'
        pinExpressCode:
          description: >-
            The quickness of the PIN delivery. Must be set for a physical card
            order and if the PIN is delivered to the cardholder.
          $ref: '#/components/schemas/DatamailerExpressCode'
        clientEphPubKey:
          $ref: '#/components/schemas/ClientEphPubKey'
        encryptedPin:
          $ref: '#/components/schemas/PinEncryptedData'
    PinDelivery:
      description: >-
        The destination of the PIN delivery. Must only be set for a physical
        card order.
      type: string
      enum:
        - DELIVER_TO_BANK
        - DELIVER_TO_CARDHOLDER
        - PIN_SET_WITH_ORDER
        - PIN_SET_WITH_SEPARATE_REQUEST
    PinDatamailerOrderRequest:
      description: >-
        Details of the PIN datamailer order request. The referenced card must be
        a physical card.
      type: object
      required:
        - cardTokenExtension
        - deliveryDestination
        - expressCode
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        deliveryDestination:
          description: Delivery destination of PIN.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        expressCode:
          description: The quickness of the PIN delivery.
          $ref: '#/components/schemas/DatamailerExpressCode'
        deliveryInformation:
          description: >-
            The delivery information must be set if the PIN is delivered to the
            cardholder.
          $ref: '#/components/schemas/DeliveryInformation'
        mailerText:
          description: >-
            Selects the individual text container for printing onto the
            datamailer. Can be set if the PIN is delivered to the cardholder.
          $ref: '#/components/schemas/MailerTextCode'
    ParentCardReference:
      description: Reference to a card from which settings can be inherited.
      type: object
      required:
        - cardToken
        - cardTokenExtension
        - shareLimits
        - deleteAfterFirstUse
        - takeoverPin
        - takeoverContactlessActivationStatus
        - takeoverFeatureToggles
        - takeoverBillingUpdater
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        shareLimits:
          description: Indicates if the limits should be shared with the parent card.
          type: boolean
        deleteAfterFirstUse:
          description: >-
            Indicates if the parent card shall be deleted after first use of new
            card.
          type: boolean
        takeoverPin:
          description: Indicates if the PIN shall be taken over from the parent card.
          type: boolean
        takeoverContactlessActivationStatus:
          description: >-
            Indicates if the contactless activation status shall be taken over
            from the parent card.
          type: boolean
        takeoverFeatureToggles:
          description: >-
            Indicates if the feature toggles shall be taken over from the parent
            card.
          type: boolean
        takeoverBillingUpdater:
          type: boolean
          description: >-
            Indicates if the new card shall be linked to the account of the
            parent card within the Mastercard automated billing updater (ABU)
            resp. the VISA Account Updater (VAU).
    CardOrderData:
      description: >-
        Card data needed to order the card. Online limits are required if they
        should not be taken over from the parent card. EMV-Profile must be set
        for a physical card order.
      type: object
      required:
        - cardId
        - accountNumber
        - onlineLimits
        - iban
        - cardMaterial
        - language
        - transactionAuthorizer
        - cardPlasticCode
      properties:
        cardId:
          $ref: '#/components/schemas/CardId'
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        iban:
          $ref: '#/components/schemas/Iban'
        cardMaterial:
          $ref: '#/components/schemas/CardMaterial'
        language:
          $ref: '#/components/schemas/Language'
        chipApplication:
          $ref: '#/components/schemas/ChipApplication'
        branchNumber:
          $ref: '#/components/schemas/BranchNumber'
        transactionAuthorizer:
          $ref: '#/components/schemas/TransactionAuthorizer'
        cardDelivery:
          description: >-
            The destination of the card delivery. Must be set for a physical
            card order.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        cardExpressCode:
          $ref: '#/components/schemas/CardExpressCode'
        cardMailerText:
          $ref: '#/components/schemas/CardMailerText'
        subCardType:
          $ref: '#/components/schemas/SubCardType'
        onlineLimits:
          $ref: '#/components/schemas/OnlineLimits'
        featureToggles:
          $ref: '#/components/schemas/FeatureToggles'
        cardPlasticCode:
          $ref: '#/components/schemas/CardPlasticCode'
        cardOrderReason:
          $ref: '#/components/schemas/CardOrderReason'
        otrcDelivery:
          $ref: '#/components/schemas/OtrcDelivery'
        otrcDatamailerDelivery:
          description: >-
            Delivery destination of OTRC datamailer. In bank card orders, this
            field will be ignored.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        otrcDatamailerExpressCode:
          description: >-
            Defines the express code of the OTRC datamailer delivery. In bank
            card orders, this field will be ignored.
          $ref: '#/components/schemas/DatamailerExpressCode'
        deliveryInformation:
          description: >-
            Delivery address of card, PIN and OTRC; only required when OTRC,
            PIN, or card is delivered to cardholder.
          $ref: '#/components/schemas/DeliveryInformation'
        pinDatamailerDelivery:
          description: >-
            Delivery destination of the PIN. Only used for physical cards. If
            pinData is provided, this field will be ignored.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        pinDatamailerExpressCode:
          description: >-
            The quickness of the PIN delivery. Only used for physical cards. If
            pinData is provided, this field will be ignored.
          $ref: '#/components/schemas/DatamailerExpressCode'
        pinData:
          $ref: '#/components/schemas/CardOrderPinData'
        pinMailerTextCode:
          description: >-
            Reference to a predefined text container that will be printed on the
            PIN datamailer. If pinData is provided, this field will be ignored.
          $ref: '#/components/schemas/MailerTextCode'
        producerCode:
          $ref: '#/components/schemas/ProducerCode'
        producerInfo:
          $ref: '#/components/schemas/ProducerInfo'
        emvProfile:
          $ref: '#/components/schemas/EmvProfile'
        cardholderDataTrack:
          $ref: '#/components/schemas/CardholderDataTrack'
        cardLine1:
          $ref: '#/components/schemas/CardLine'
        cardLine2:
          $ref: '#/components/schemas/CardLine'
        cardLine3:
          $ref: '#/components/schemas/BankCardLine'
        cardLine4:
          $ref: '#/components/schemas/BankCardLine'
        bankDataTrack2:
          description: >-
            Bank card specific field which indicates the data for track2. It is
            mandatory for bank cards. The content of this field has to be agreed
            with the card producer and will not be checked by SIX.
          type: integer
          format: int32
          minimum: 0
          maximum: 999999
        bankDataTrack3:
          description: >-
            Bank card specific field which indicates the data for track3. The
            content of this field has to be agreed with the card producer and
            will not be checked by SIX.
          type: integer
          format: int64
          minimum: 0
          maximum: 999999999999
        useBankCardWithPin:
          $ref: '#/components/schemas/UseBankCardWithPin'
        contactlessActivationMode:
          $ref: '#/components/schemas/ContactlessActivationMode'
    CardMutationRequest:
      description: >-
        Fields to modify. Fields that are set will be modified. Others will be
        ignored.
      type: object
      required:
        - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        bccData:
          $ref: '#/components/schemas/CardMutationBccData'
        fraudConfiguration:
          $ref: '#/components/schemas/CardMutationFraudConfiguration'
        cardApplication:
          $ref: '#/components/schemas/CardMutationCardApplication'
        contactlessActivationStatus:
          $ref: '#/components/schemas/CardMutationContactlessActivationStatus'
        featureToggles:
          $ref: '#/components/schemas/CardMutationFeatureToggles'
    CardMutationBccData:
      description: Information about the cardholder to mutate.
      type: object
      required:
        - salutation
        - firstName
        - familyName
        - street
        - city
        - postalCode
        - country
      properties:
        salutation:
          $ref: '#/components/schemas/Salutation'
        firstName:
          $ref: '#/components/schemas/FirstName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        street:
          description: Street name.
          type: string
          maxLength: 25
          examples:
            - Bahnhofstrasse
        streetNo:
          description: Street number.
          type: string
          maxLength: 5
          examples:
            - '1'
        city:
          description: Location city.
          type: string
          maxLength: 25
          examples:
            - Zürich
        postalCode:
          description: Postal code.
          type: string
          maxLength: 10
          examples:
            - '8001'
        country:
          $ref: '#/components/schemas/Country'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        birthdate:
          description: Birthdate to identify the customer.
          type: string
          format: date
          examples:
            - '2000-12-31'
        emailAddress:
          description: Email address to identify the customer.
          type: string
          examples:
            - peter.schweizer@mailbox.org
        customerRelationshipOpeningDate:
          description: >-
            Date when the customer relationship was opened; used to identify the
            customer.
          type: string
          format: date
          examples:
            - '2021-12-31'
        accountOpeningDate:
          description: Date when the account was opened; used to identify the customer.
          type: string
          format: date
          examples:
            - '2021-12-31'
        accountAuthorities:
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/AccountAuthority'
        individualIdentificationTag:
          description: Individual tag to identify the customer.
          type: string
          maxLength: 80
          examples:
            - Owner of a sailing boat
        ebankingContractNo:
          description: Ebanking contract number to identify the customer.
          type: string
          maxLength: 15
          examples:
            - ABC-56789012345
    CardMutationFraudConfiguration:
      description: Controls the fraud configuration of a card.
      type: object
      required:
        - restrictedRegions
      properties:
        restrictedRegions:
          $ref: '#/components/schemas/RestrictedRegions'
        restrictedCountries:
          $ref: '#/components/schemas/RestrictedCountries'
    CardMutationCardApplication:
      description: >-
        Controls card application settings for the EMV-Profile, online limits
        and transaction authorizer.
      type: object
      properties:
        emvProfile:
          $ref: '#/components/schemas/EmvProfile'
        onlineLimits:
          $ref: '#/components/schemas/OnlineLimits'
        transactionAuthorizer:
          $ref: '#/components/schemas/TransactionAuthorizer'
    CardMutationContactlessActivationStatus:
      description: Controls whether contactless is enabled.
      type: boolean
    CardMutationFeatureToggles:
      description: Feature Toggles to mutate.
      type: object
      properties:
        eCommerceAllowed:
          description: Indicates if the use of ecommerce is allowed.
          type: boolean
        trxOnlyAsChipAndPin:
          description: >-
            Indicates if cvm is active, i.e. card can do transaction only as
            Chip and PIN.
          type: boolean
        magStripePaymentAllowed:
          description: Defines if magnetic stripe payments are allowed.
          type: boolean
        automaticBilling:
          description: >-
            Indicates if the cardholder participates to the automatic billing
            update.
          type: boolean
        purchaseWithCashBackAllowed:
          description: Defines if purchase with cash back is allowed.
          type: boolean
        blockedMerchantCategoryCodes:
          description: List of blocked merchant category codes.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/MerchantCategoryCode'
        merchantInitiatedTrxAllowed:
          description: >-
            Indicates if merchant initiated transactions - such as Recurring,
            Installment, Unscheduled - are allowed.
          type: boolean
        atmAllowed:
          description: Defines if withdrawals are allowed at ATMs.
          type: boolean
        posAllowed:
          description: Defines if payments are allowed at POS terminals.
          type: boolean
        motoAllowed:
          description: Defines if mail or phone orders are allowed.
          type: boolean
        bypassGeoblocking:
          description: Defines if geo blocking is ignored for the card.
          type: boolean
        moneySendReceiveAllowance:
          $ref: '#/components/schemas/MoneySendReceiveAllowance'
        reservationAllowed:
          description: Defines if reservation transactions are allowed.
          type: boolean
        transactionPushEnabled:
          description: Defines if transactions are pushed to debiX.
          type: boolean
        gamblingAndBettingAllowance:
          $ref: '#/components/schemas/GamblingAndBettingAllowance'
    RestrictedRegions:
      description: A list of regions from which authorizations will be declined.
      type: array
      minItems: 1
      maxItems: 10
      items:
        $ref: '#/components/schemas/Region'
    RestrictedCountries:
      description: >-
        A list of countries from which authorizations will be declined. Country
        code values are expected in ISO 3166-1 alpha-2 format.


        The option to define a restriction for individual countries is only
        available on request; please contact SIX if you are interested.
      type: array
      minItems: 1
      maxItems: 300
      items:
        $ref: '#/components/schemas/Country'
    CardCredentialsRequest:
      type: string
      description: >
        JSON Web Token signed by the issuer, containing all parameters for
        securely retrieving sensitive card credentials. 

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - see "#/components/schemas/CardCredentialsRequestJwsPayload"
    CardCredentialsRequestJwsPayload:
      type: object
      required:
        - cardToken
        - cardTokenExtension
        - clientEphPubKey
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        clientEphPubKey:
          description: >-
            Ephemeral public key (base64 encoded) of the issuer. Used for
            Diffie-Hellman key exchange.
          type: string
          minLength: 1
          examples:
            - SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    CardCredentialsResponse:
      type: string
      description: >
        JSON Web Token containing the encrypted card credentials and an
        ephemeral public key to complete the Diffie-Hellman key exchange. 

        * The algorithm of the JWS signature is 'none'.
      examples:
        - >-
          see unencrypted object at 
          "#/components/schemas/CardCredentialsResponseJwsPayload".
    CardCredentialsResponseJwsPayload:
      type: object
      required:
        - serverEphPubKey
        - encryptedData
      properties:
        serverEphPubKey:
          description: >-
            Ephemeral public key (base64 encoded) of the debiX backend. Used for
            the Diffie-Hellman key exchange.
          type: string
          minLength: 1
          examples:
            - QbTKxwRJSMeKKF2Q_T4fwpMeJf36POk6yJVadQssZi9
        encryptedData:
          description: >-
            CardCredentialsResponseUnencryptedData with card credentials, base64
            encoded and symmetrically encrypted with the shared Diffie-Hellman
            key.
          type: string
          minLength: 1
          examples:
            - >-
              see unencrypted object at
              "#/components/schemas/CardCredentialsResponseUnencryptedData".
    CardCredentialsResponseUnencryptedData:
      type: object
      required:
        - fpan
        - cvv
      properties:
        fpan:
          description: Funding Primary Account Number of the card.
          type: string
          pattern: ^\d{16}$
          examples:
            - '1234567812345678'
        cvv:
          description: Card Verification Value of the card.
          type: string
          pattern: ^\d{3}$
          examples:
            - '123'
    DeliveryInformation:
      description: Delivery address of card, PIN and OTRC.
      type: object
      required:
        - address
        - country
      properties:
        address:
          $ref: '#/components/schemas/UnstructuredAddress'
        country:
          $ref: '#/components/schemas/Country'
        salutationText:
          description: Salutation text for the delivery.
          type: string
          maxLength: 50
    StartSetPinRequest:
      type: string
      description: >
        JSON Web Token signed by the issuer to get an ephemeral public key from
        debiX for the given card. 

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - see "#/components/schemas/StartSetPinRequestJwsPayload"
    StartSetPinRequestJwsPayload:
      type: object
      required:
        - cardToken
        - cardTokenExtension
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    StartSetPinByCardIdRequest:
      type: string
      description: >
        JSON Web Token signed by the issuer to get an ephemeral public key from
        debiX for the given cardId. 

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - see "#/components/schemas/StartSetPinByCardIdRequestJwsPayload"
    StartSetPinByCardIdRequestJwsPayload:
      type: object
      required:
        - cardId
      properties:
        cardId:
          $ref: '#/components/schemas/CardId'
    ResetPinTryCounterRequest:
      description: >-
        Contains the cardTokenExtension used together with the cardToken path
        parameter for card identification.
      type: object
      required:
        - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    StartSetPinResponse:
      type: string
      description: >
        JSON Web Token signed by debiX containing an ephemeral public key to
        complete the Diffie-Hellman key exchange, used to encrypt the new PIN to
        be set for this card. 

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519.

        * The JOSE header contains a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - >-
          see unencrypted object at 
          "#/components/schemas/StartSetPinResponseJwsPayload"
    StartSetPinResponseJwsPayload:
      type: object
      required:
        - serverEphPubKey
      properties:
        serverEphPubKey:
          description: >-
            Ephemeral public key (base64 encoded) of the debiX backend. Used for
            the Diffie-Hellman key exchange.
          type: string
          minLength: 1
          examples:
            - QbTKxwRJSMeKKF2Q_T4fwpMeJf36POk6yJVadQssZi9
    CardOrderPinData:
      type: string
      description: >
        JSON Web Token signed by the issuer to set the PIN for the ordered card.

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - see '#/components/schemas/CardOrderPinDataJwsPayload'
    CardOrderPinDataJwsPayload:
      type: object
      required:
        - clientEphPubKey
        - encryptedData
      properties:
        clientEphPubKey:
          $ref: '#/components/schemas/ClientEphPubKey'
        encryptedData:
          $ref: '#/components/schemas/PinEncryptedData'
    SetPinRequest:
      type: string
      description: >
        JSON Web Token signed by the issuer to set the PIN for the given card.

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - see '#/components/schemas/SetPinRequestJwsPayload'
    SetPinRequestJwsPayload:
      type: object
      required:
        - cardToken
        - cardTokenExtension
        - clientEphPubKey
        - encryptedData
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        clientEphPubKey:
          $ref: '#/components/schemas/ClientEphPubKey'
        encryptedData:
          $ref: '#/components/schemas/PinEncryptedData'
    ClientEphPubKey:
      description: >-
        Ephemeral public key (base64 encoded) of the issuer. Used for the
        Diffie-Hellman key exchange.
      type: string
      minLength: 1
      examples:
        - SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    PinEncryptedData:
      description: >-
        SetPinRequestUnencryptedData with new PIN, base64 encoded and
        symmetrically encrypted with the shared Diffie-Hellman key.
      type: string
      minLength: 1
      examples:
        - >-
          see unencrypted object at
          '#/components/schemas/SetPinRequestUnencryptedData'
    SetPinRequestUnencryptedData:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
          pattern: ^\d{4,6}$
          examples:
            - '123456'
    GetPinRequest:
      type: string
      description: >
        JSON Web Token signed by the issuer, containing all parameters for
        securely retrieving the PIN. 

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - see "#/components/schemas/GetPinRequestJwsPayload"
    GetPinRequestJwsPayload:
      type: object
      required:
        - cardToken
        - cardTokenExtension
        - clientEphPubKey
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        clientEphPubKey:
          description: >-
            Ephemeral public key (base64 encoded) of the issuer. Used for
            Diffie-Hellman key exchange.
          type: string
          minLength: 1
          examples:
            - SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    GetPinResponse:
      type: string
      description: >
        JSON Web Token signed by debiX containing the encrypted PIN and an
        ephemeral public key to complete the Diffie-Hellman key exchange. 

        * The algorithm of the JWS signature can be one of RS256/384/512,
        PS256/384/512, ES256/384/512 or EdDsa/Ed25519.

        * The JOSE header contains a 'x5t#S256' parameter with the X.509
        certificate SHA-256 thumbprint of the key used to sign the token.
        (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)
      examples:
        - >-
          see encrypted object at
          "#/components/schemas/GetPinResponseJwsPayload".
    GetPinResponseJwsPayload:
      type: object
      required:
        - serverEphPubKey
        - encryptedData
      properties:
        serverEphPubKey:
          description: >-
            Ephemeral public key (base64 encoded) of the debiX backend. Used for
            the Diffie-Hellman key exchange.
          type: string
          minLength: 1
          examples:
            - QbTKxwRJSMeKKF2Q_T4fwpMeJf36POk6yJVadQssZi9
        encryptedData:
          description: >-
            GetPinResponseUnencryptedData with PIN, base64 encoded and
            symmetrically encrypted with the shared Diffie-Hellman key.
          type: string
          minLength: 1
          examples:
            - >-
              see unencrypted object at
              "#/components/schemas/GetPinResponseUnencryptedData".
    GetPinResponseUnencryptedData:
      type: object
      required:
        - pin
      properties:
        pin:
          type: string
          pattern: ^\d{4,6}$
          examples:
            - '123456'
    ThreeDsRegisterRequest:
      description: >-
        Contains the card identifiers and 3DS-related data for the registration
        of a card.
      type: object
      required:
        - cardTokenExtension
