      type: boolean
    DatamailerExpressCode:
      description: Defines the express code of OTRC and PIN datamailer delivery.
      type: string
      enum:
      - A_POST
      - B_POST
      - REGISTERED
      default: A_POST
    CardDetailsRequest_2:
      description: Contains the identifier of the card for which to return the details.
      type: object
      required:
      - cardId
      properties:
        cardId:
          $ref: '#/components/schemas/CardId_2'
    CardNumber:
      description: Card number of the card.
      type: integer
      format: int32
      minimum: 1
      maximum: 99999999
      examples:
      - 12345678
    Birthdate:
      description: Date of birth.
      type: string
      format: date
      examples:
      - '2000-12-31'
    FraudConfiguration:
      description: The fraud configuration, containing restrictions for countries and regions. Authorizations from a country will be declined if the country itself, or the region it belongs to, is restricted.
      type: object
      properties:
        restrictedRegions:
          $ref: '#/components/schemas/RestrictedRegions'
        restrictedCountries:
          $ref: '#/components/schemas/RestrictedCountries'
        riskShieldListing:
          description: A list of monitoring lists in RiskShield on which a card can be listed. Deprecated and ignored in card order requests.
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RiskShieldList'
    SubCardType:
      description: Sub card type that is linked to a dedicated BIN range and specifies a product like 'Platinum', 'EUR' or 'Student'. It must be configured in bank master data, otherwise field can not be used.
      type: string
      minLength: 2
      maxLength: 2
      examples:
      - A1
    VisaADAliasId_2:
      description: The UUID generated by Alias Directory which identifies the alias
      type: string
      minLength: 36
      maxLength: 36
      examples:
      - e336c8c8-2945-4be3-af3e-951ec2d01219
    CardholderDataTrack:
      description: "A formatted combination of family name, name and title. Must only be set for a Mastercard physical card order.\nValid formats include:\n  - FAMILYNAME/\n  - FAMILYNAME/NAME\n  - FAMILYNAME/NAME.DR\n  - FAMILYNAME/.DR\n"
      type: string
      maxLength: 26
      minLength: 2
      examples:
      - SCHWEIZER/PETER
    CardToken:
      description: Unique card token of a card.
      type: string
      pattern: ^CTK-[0-9a-fA-F]{32}$
      minLength: 36
      maxLength: 36
      examples:
      - CTK-54716A6080B14CF19CEA3C170F85B1DD
    Currency:
      description: The currency according to ISO 4217.
      type: string
      maxLength: 3
      examples:
      - CHF
    ContactlessActivationStatus:
      description: Describes the contactless activation status of the card.
      type: string
      enum:
      - UNKNOWN
      - ACTIVATED_CONFIRMED
      - CARD_WITHOUT_CONTACTLESS
      - DEACTIVATED_UNCONFIRMED
      - DEACTIVATED_CONFIRMED
      - DEACTIVATION_PENDING
      - ACTIVATED_UNCONFIRMED
      - ACTIVATION_PENDING
      - NEVER_ACTIVATED
    CardExpressCode:
      description: Defines the express code of the card delivery. Must be set for a physical card order and CardDelivery is DELIVER_TO_CARDHOLDER.
      type: string
      enum:
      - A_POST
      - B_POST
      - REGISTERED
      - COURIER
    Country:
      description: Country code in format ISO 3166-1 alpha 2.
      type: string
      pattern: '[A-Z]{2}'
      examples:
      - CH
    CardTokenResponse:
      description: Contains the card token of the card.
      type: object
      required:
      - cardToken
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
    StartSetPinByCardIdRequest:
      type: string
      description: "JSON Web Token signed by the issuer to get an ephemeral public key from debiX for the given cardId. \n* The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.\n* The JOSE header must contain a 'x5t#S256' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)\n"
      examples:
      - see "#/components/schemas/StartSetPinByCardIdRequestJwsPayload"
    CardCredentialsResponse:
      type: string
      description: "JSON Web Token containing the encrypted card credentials and an ephemeral public key to complete the Diffie-Hellman key exchange. \n* The algorithm of the JWS signature is 'none'.\n"
      examples:
      - see unencrypted object at  "#/components/schemas/CardCredentialsResponseJwsPayload".
    Iban:
      description: IBAN of the bank account for which the card was issued.
      type: string
      minLength: 21
      maxLength: 21
      examples:
      - CH3456789012345678901
    PinRecoveryStatus:
      description: The status of the PIN recovery.
      type: string
      enum:
      - NO_PIN_ORDERED
      - NEW_PIN_ORDERED_PIN_CHANGE_REQUIRED
      - NEW_PIN_ORDERED_RECOVERY_PROCESSED
      - NEW_PIN_ORDERED_RECOVERY_CONFIRMED
      - NEW_PIN_ORDERED_RECOVERY_NOK
  parameters:
    RequestIdHeader:
      in: header
      name: x-request-id
      description: A unique identifier for a request and response pair.
      schema:
        type: string
    IssuerTraceIdHeader:
      in: header
      name: issuer-trace-id
      description: A issuer‑provided unique trace identifier to correlate the complete flow started by this request.
      schema:
        type: string
        minLength: 1
        maxLength: 26
