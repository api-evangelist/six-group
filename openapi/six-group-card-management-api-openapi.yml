              schema:
                $ref: '#/components/schemas/BankApiError'
  /cards/reset-pin-try-counter:
    post:
      tags:
      - Card Management
      summary: Resets the PIN try counter for the specified card.
      description: 'Deprecated, use `POST /debix/bank/cardtoken/v2/cards/{cardToken}/reset-pin-try-counter` instead.

        Requests the reset of PIN try counter for the given card. After the reset at the card processor, the cardholder has three PIN attempts again.


        In addition to standard application error codes, the following codes can be returned:

        * 4430 - UNKNOWN_CARD

        * 4474 - RESET_PIN_TRY_COUNTER_NOT_ALLOWED_FOR_BLOCKED_OR_DELETED_CARD

        * 4475 - RESET_PIN_TRY_COUNTER_DAILY_LIMIT_EXCEEDED

        * 4484 - BANK_CARDS_NOT_SUPPORTED_BY_ISSUER

        '
      operationId: resetPinTryCounter
      parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - $ref: '#/components/parameters/IssuerTraceIdHeader'
      requestBody:
        description: Request to reset the PIN try counter containing the card identifiers.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPinTryCounterRequest_2'
      responses:
        '202':
          description: Accepted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankApiError'
        '404':
          description: Not found or card is deleted
          content:
            application/json:
