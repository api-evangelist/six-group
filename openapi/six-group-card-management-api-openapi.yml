      properties:
        cardInstanceToken:
          $ref: '#/components/schemas/CardInstanceToken'
    BranchNumber:
      description: Branch number of the site where the account was initially created.
      type: integer
      format: int32
      minimum: 0
      maximum: 9999
      examples:
      - 1
    CardSequenceNumber:
      description: Sequence number of the card.
      type: integer
      format: int32
      minimum: 0
      maximum: 9
      examples:
      - 2
    MailerTextCode:
      description: Reference to a predefined text container that will be printed on the datamailer.
      type: integer
      format: int32
    RiskShieldList:
      description: '- "EXCLUSION_LIST": General whitelist, i.e. all rules that lead to RiskShield declines and automatic blockings are overridden.

        - "GREY_LIST_CNP": The non-secure card not present transactions are declined.

        - "GREY_LIST_F2F": Card present transactions are declined.

        - "INTERNAL_DECLINE_LIST": General blacklist, i.e. the transactions are declined.

        - "MONITORED_CARDS_LIST": For card present transactions an alert is generated.

        - "RULE_WHITE_CARD_LIST": Certain rules for cards are disabled, i.e. no transactions are declined and no alerts generated.'
      type: string
    CardOrderPinData:
      type: string
      description: 'JSON Web Token signed by the issuer to set the PIN for the ordered card.

        * The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.

        * The JOSE header must contain a ''x5t#S256'' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)

        '
      examples:
      - see '#/components/schemas/CardOrderPinDataJwsPayload'
    UpdateCardStatusRequest_2:
      description: Contains the request to update the status of the card. The card block reason is required when blocking the card. Only when blocking a card, the information in card block reason, card block origin and blocked card replacement are taken into account; in other cases, they are ignored.
      type: object
      required:
      - action
      - cardId
      - cardStatusUpdateReason
      properties:
        action:
          $ref: '#/components/schemas/UpdateCardStatusAction'
        cardId:
          $ref: '#/components/schemas/CardId_2'
        cardStatusUpdateReason:
          $ref: '#/components/schemas/CardStatusUpdateReason'
        cardBlockReason:
          $ref: '#/components/schemas/CardBlockReason'
          description: 'The reason why the card was blocked. Note: cardBlockReason is a mandatory parameter which must be provided when action = BLOCK.'
        cardBlockOrigin:
          $ref: '#/components/schemas/CardBlockOriginViaBank'
        blockedCardReplacement:
          $ref: '#/components/schemas/BlockedCardReplacement'
    CardBlockReason:
      description: The reason why the card was blocked.
      type: string
      enum:
      - NO_INFORMATION
      - CARD_LOST_WITHOUT_PIN
      - CARD_STOLEN_WITHOUT_PIN
      - FRAUD
      - CREDIT_STANDING
      - TOO_MANY_INVALID_PIN_ATTEMPTS
      - CARD_LOST_WITH_PIN
      - CARD_STOLEN_WITH_PIN
      - PICK_UP_BM_TM
      - CARD_DID_NOT_ARRIVE
      - PIN_DID_NOT_ARRIVE
      - FRAUD_SUSPECTED_ANALYSIS
      - FRAUD_SUSPECTED_CARDHOLDER_FEEDBACK_REQUIRED
      - TECHNICAL_REASON
      - DEFECTIVE_CARD
      - CARD_TEMPORARILY_BLOCKED
    CardBlockInterface:
      description: The interface used for blocking the card.
      type: string
      enum:
      - DEBIX_API
      - DEBIX_APP
      - DEBIX_PORTAL
      - DEBIT_ONLINE_WEB
      - DEBIT_ONLINE_XML
      - BLOCKING_APPLICATION_GENERATED_BY_SIX
    CardOrderReversalRequest:
      type: object
      required:
      - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    CardOrderReversalRequest_2:
      type: object
      required:
      - cardId
      properties:
        cardId:
          $ref: '#/components/schemas/CardId_2'
    CardMutationContactlessActivationStatus:
