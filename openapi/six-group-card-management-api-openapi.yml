        expressCode:
          description: The quickness of the PIN delivery.
          $ref: '#/components/schemas/DatamailerExpressCode'
        deliveryInformation:
          description: The delivery information must be set if the PIN is delivered to the cardholder.
          $ref: '#/components/schemas/DeliveryInformation'
        mailerText:
          description: Selects the individual text container for printing onto the datamailer. Can be set if the PIN is delivered to the cardholder.
          $ref: '#/components/schemas/MailerTextCode'
    AuthenticationMethodStatus:
      description: Status of an authentication method.
      type: string
      enum:
      - ENABLED
      - DISABLED
      - BLOCKED
    ProducerCode:
      description: Defines the producer of the ordered card. Must only be set for a physical card order.
      type: string
      enum:
      - THALES
      - EXCEET_GERMANY
      - EXCEET_SWITZERLAND
      - NID
    BankApiError:
      description: Information about an error on API requests.
      type: object
      required:
      - applicationError
      - errorCode
      properties:
        applicationError:
          description: The name of the application error.
          type: string
          examples:
          - OPERATION_FAILED
        errorCode:
          description: Code describing the error.
          type: integer
          format: int32
          examples:
          - 5001
        description:
          description: A human readable explanation specific to this occurrence of the problem.
          type: string
          examples:
          - The requested operation failed.
        errors:
          description: List of error details.
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ErrorDetail'
        errorToken:
          description: A generated error token referencing the actual error and logged on the server.
          type: string
          examples:
          - 618503aa-7beb-4d3d-986e-36f1fdbd0e13
    ResetPinTryCounterRequest:
      description: Contains the cardTokenExtension used together with the cardToken path parameter for card identification.
      type: object
      required:
      - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    GetPinRequest:
      type: string
      description: "JSON Web Token signed by the issuer, containing all parameters for securely retrieving the PIN. \n* The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.\n* The JOSE header must contain a 'x5t#S256' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)\n"
      examples:
      - see "#/components/schemas/GetPinRequestJwsPayload"
    CardInstanceTokenRequest:
      description: Contains the identifier of the card for which to return the card instance token.
      type: object
      required:
      - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    StartSetPinResponse:
      type: string
      description: "JSON Web Token signed by debiX containing an ephemeral public key to complete the Diffie-Hellman key exchange, used to encrypt the new PIN to be set for this card. \n* The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519.\n* The JOSE header contains a 'x5t#S256' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)\n"
      examples:
      - see unencrypted object at  "#/components/schemas/StartSetPinResponseJwsPayload"
    MoneySendReceiveAllowance:
      description: Defines conditions if money send to and receive from another cardholder is allowed.
      type: string
      enum:
      - NOT_ALLOWED
      - RECEIVE_ALLOWED
      - SEND_ALLOWED
      - RECEIVE_AND_SEND_ALLOWED
    CommonCardInformation:
      description: Common information about the card.
      type: object
      required:
      - accountNumber
      - iban
      - cardMaterial
      - markedAsDelayedDelete
      - transactionAuthorizer
      properties:
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        iban:
          $ref: '#/components/schemas/Iban'
        cardMaterial:
          $ref: '#/components/schemas/CardMaterial'
        plasticCode:
          $ref: '#/components/schemas/CardPlasticCode'
        subCardType:
          $ref: '#/components/schemas/SubCardType'
        language:
          $ref: '#/components/schemas/Language'
        status:
          $ref: '#/components/schemas/CardStatus'
        cardStatusUpdateReason:
          $ref: '#/components/schemas/CardStatusUpdateReason'
        blockInformation:
          $ref: '#/components/schemas/CardBlockInformation'
        pinRemainingRetries:
          description: The number of remaining PIN retries.
          type: integer
          format: int32
          minimum: 0
          maximum: 3
          examples:
          - 2
        pinRecoveryStatus:
          $ref: '#/components/schemas/PinRecoveryStatus'
        markedAsDelayedDelete:
          description: Flag indicating card is scheduled for delayed deletion.
          type: boolean
        transactionAuthorizer:
          $ref: '#/components/schemas/TransactionAuthorizer'
        cardOrderDateTime:
          description: Datetime when the card was ordered.
          type: string
          format: date-time
          examples:
          - '2024-04-13T08:30:00Z'
    CardOrderRequest:
      description: Configuration specifying the new card to be ordered.
      type: object
      required:
      - cardOrderData
      properties:
        cardOrderData:
          $ref: '#/components/schemas/CardOrderData'
        parentCardReference:
          $ref: '#/components/schemas/ParentCardReference'
        bccData:
          $ref: '#/components/schemas/BccData'
        fraudConfiguration:
          $ref: '#/components/schemas/FraudConfiguration'
        isBlocked:
          description: Defines if the card is ordered blocked.
          type: boolean
          examples:
          - false
    PhoneNumber:
      description: 'Mobile or landline phone number. Note: phoneNumber is a mandatory parameter which must be provided to register a card with authentication method SMS_ONLY, PIN, BIOMETRIC or BIOMETRIC_WITH_PIN_FALLBACK. Furthermore, phoneNumber must also be provided in case the issuer desires to register a card for DELEGATED as primary authentication method, with additionally SMS as fallback (as secondary authentication method).  For issuers with special regulations (e.g. PSD2), please refer to the additional indications provided under the “password” field.'
      type: string
      pattern: ^([+]|00)[1-9][0-9]{8,18}$
      examples:
      - '+41797778899'
    CardMutationBccData:
      description: Information about the cardholder to mutate.
      type: object
      required:
      - salutation
      - firstName
      - familyName
      - street
      - city
      - postalCode
      - country
      properties:
        salutation:
          $ref: '#/components/schemas/Salutation'
        firstName:
          $ref: '#/components/schemas/FirstName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        street:
          description: Street name.
          type: string
          maxLength: 25
          examples:
          - Bahnhofstrasse
        streetNo:
          description: Street number.
          type: string
          maxLength: 5
          examples:
          - '1'
        city:
          description: Location city.
          type: string
          maxLength: 25
          examples:
          - Zürich
        postalCode:
          description: Postal code.
          type: string
          maxLength: 10
          examples:
          - '8001'
        country:
          $ref: '#/components/schemas/Country'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        birthdate:
          description: Birthdate to identify the customer.
          type: string
          format: date
          examples:
          - '2000-12-31'
        emailAddress:
          description: Email address to identify the customer.
          type: string
          examples:
          - peter.schweizer@mailbox.org
        customerRelationshipOpeningDate:
          description: Date when the customer relationship was opened; used to identify the customer.
          type: string
          format: date
          examples:
          - '2021-12-31'
        accountOpeningDate:
          description: Date when the account was opened; used to identify the customer.
          type: string
          format: date
          examples:
          - '2021-12-31'
        accountAuthorities:
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/AccountAuthority'
        individualIdentificationTag:
          description: Individual tag to identify the customer.
          type: string
          maxLength: 80
          examples:
          - Owner of a sailing boat
        ebankingContractNo:
          description: Ebanking contract number to identify the customer.
          type: string
          maxLength: 15
          examples:
          - ABC-56789012345
    PinDatamailerOrderRequest:
      description: Details of the PIN datamailer order request. The referenced card must be a physical card.
