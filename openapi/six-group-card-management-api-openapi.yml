        restrictedCountries:
          $ref: '#/components/schemas/RestrictedCountries'
    PinDatamailerOrderRequest_2:
      description: Details of the PIN datamailer order request. The referenced card must be a physical card.
      type: object
      required:
      - cardId
      - deliveryDestination
      - expressCode
      properties:
        cardId:
          $ref: '#/components/schemas/CardId_2'
