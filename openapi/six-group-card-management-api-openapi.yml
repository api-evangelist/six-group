        contactlessActivationStatus:
          $ref: '#/components/schemas/CardMutationContactlessActivationStatus'
        featureToggles:
          $ref: '#/components/schemas/CardMutationFeatureToggles'
    AccountNumber:
      description: Unique number identifying a bank account.
      type: string
      minLength: 1
      maxLength: 16
      examples:
      - AB-4567890123456
    ShortCardIdResponse:
