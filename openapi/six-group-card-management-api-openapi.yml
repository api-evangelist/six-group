        expressCode:
          description: The quickness of the PIN delivery.
          $ref: '#/components/schemas/DatamailerExpressCode'
        deliveryInformation:
          description: The delivery information must be set if the PIN is delivered to the cardholder.
          $ref: '#/components/schemas/DeliveryInformation'
        mailerText:
          description: Selects the individual text container for printing onto the datamailer. Can be set if the PIN is delivered to the cardholder.
          $ref: '#/components/schemas/MailerTextCode'
    CardMutationRequest_2:
      description: Fields to modify. Fields that are set will be modified. Others will be ignored.
      type: object
      required:
      - cardId
      properties:
        cardId:
          $ref: '#/components/schemas/CardId_2'
        bccData:
