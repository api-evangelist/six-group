        threeDsInformation:
          $ref: '#/components/schemas/ThreeDsInformation'
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardInstanceToken:
          $ref: '#/components/schemas/CardInstanceToken'
    ThreeDsInformation:
