                $ref: '#/components/schemas/BankApiError'
components:
  schemas:
    VisaC2PCustomerId:
      description: Unique identifier for the customer.
      type: string
      format: uuid
    VisaADAliasId:
      description: The UUID generated by Alias Directory which identifies the alias.
      type: string
      minLength: 36
      maxLength: 36
      examples:
      - e336c8c8-2945-4be3-af3e-951ec2d01219
    BankClearingNumber:
      description: Unique number used to identify each bank agency or branch in the bank directory.
      type: integer
      format: int32
      minimum: 100
      maximum: 99999
      examples:
      - 50000
    CardStatusUpdateReason:
      description: The reason for the status update of the card.
      type: string
      enum:
      - ISSUER_DECISION
      - USER_DECISION
      examples:
      - USER_DECISION
    BlockedCardReplacement:
      description: Indicates the need of a card replacement when the card has been blocked. This is only an indicator and does not trigger the actual card replacement.
      type: string
      enum:
      - NO_REPLACEMENT
      - CARD
      - CARD_WITH_PIN_MAILER
      - CARD_WITH_PIN_AND_OTRC_MAILER
      - CARD_WITH_OTRC_MAILER
      - CARD_WITH_UNKNOWN_MAILER
    BccData:
      description: Information about the cardholder from the bank card central.
      type: object
      required:
      - salutation
      - firstName
      - familyName
      - street
      - city
      - postalCode
      - country
      properties:
        salutation:
          $ref: '#/components/schemas/Salutation'
        firstName:
          $ref: '#/components/schemas/FirstName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        street:
          description: Street name.
          type: string
          maxLength: 25
          examples:
          - Bahnhofstrasse
        streetNo:
          description: Street number.
          type: string
          maxLength: 5
          examples:
          - '1'
        city:
          description: Location city.
          type: string
          maxLength: 25
          examples:
          - Zürich
        postalCode:
          description: Postal code.
          type: string
          maxLength: 10
          examples:
          - '8001'
        country:
          $ref: '#/components/schemas/Country'
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        birthdate:
          description: Birthdate to identify the customer.
          type: string
          format: date
          examples:
          - '2000-12-31'
        emailAddress:
          description: Email address to identify the customer.
          type: string
          examples:
          - peter.schweizer@mailbox.org
        customerRelationshipOpeningDate:
          description: Date when the customer relationship was opened; used to identify the customer.
          type: string
          format: date
          examples:
          - '2021-12-31'
        accountOpeningDate:
          description: Date when the account was opened; used to identify the customer.
          type: string
          format: date
          examples:
          - '2021-12-31'
        accountAuthorities:
          type: array
          minItems: 0
          maxItems: 4
          items:
            $ref: '#/components/schemas/AccountAuthority'
        individualIdentificationTag:
          description: Individual tag to identify the customer.
          type: string
          maxLength: 80
          examples:
          - Owner of a sailing boat
        ebankingContractNo:
          description: Ebanking contract number to identify the customer.
          type: string
          maxLength: 15
          examples:
          - ABC-56789012345
    BankCardLine:
      description: Bank card specific field. The content of this field has to be agreed with the card producer and will not be checked by SIX.
      type: string
    CardDetailsRequest:
      description: Contains identifiers of the card for which to return the details.
      type: object
      required:
      - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
    EmvProfile:
      description: Information about the EMV-Profile. Must be set for a physical card order.
      type: object
      required:
      - emvCurrency
      properties:
        emvCurrency:
          $ref: '#/components/schemas/Currency'
        emvProfileId:
          description: The identifier of an EMV-Profile. Must correspond to the field ChipApplication.
          type: integer
          examples:
          - 4
    DatamailerDeliveryDestination:
      description: Specifies the delivery destination for OTRC, PIN, and card datamailer.
      type: string
      enum:
      - DELIVER_TO_BANK
      - DELIVER_TO_CARDHOLDER
    CardId:
      description: Complex object representing a card consisting of bank clearing number, card number, card type, card sequence number and card expiry.
      type: object
      required:
      - bankClearingNumber
      - cardNumber
      - cardType
      - cardSequenceNumber
      - cardExpiry
      properties:
        bankClearingNumber:
          $ref: '#/components/schemas/BankClearingNumber'
        cardNumber:
          $ref: '#/components/schemas/CardNumber'
        cardType:
          $ref: '#/components/schemas/CardType'
        cardSequenceNumber:
          $ref: '#/components/schemas/CardSequenceNumber'
        cardExpiry:
          $ref: '#/components/schemas/YearMonth'
    ParentCardReference:
      description: Reference to a card from which settings can be inherited.
      type: object
      required:
      - cardToken
      - cardTokenExtension
      - shareLimits
      - deleteAfterFirstUse
      - takeoverPin
      - takeoverContactlessActivationStatus
      - takeoverFeatureToggles
      - takeoverBillingUpdater
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        shareLimits:
          description: Indicates if the limits should be shared with the parent card.
          type: boolean
        deleteAfterFirstUse:
          description: Indicates if the parent card shall be deleted after first use of new card.
          type: boolean
        takeoverPin:
          description: Indicates if the PIN shall be taken over from the parent card.
          type: boolean
        takeoverContactlessActivationStatus:
          description: Indicates if the contactless activation status shall be taken over from the parent card.
          type: boolean
        takeoverFeatureToggles:
          description: Indicates if the feature toggles shall be taken over from the parent card.
          type: boolean
        takeoverBillingUpdater:
          type: boolean
          description: Indicates if the new card shall be linked to the account of the parent card within the Mastercard automated billing updater (ABU) resp. the VISA Account Updater (VAU).
    CardBlockInformation:
      description: Contains information about blocked cards.
      type: object
      properties:
        blockReason:
          $ref: '#/components/schemas/CardBlockReason'
        blockOrigin:
          $ref: '#/components/schemas/CardBlockOrigin'
        blockInterface:
          $ref: '#/components/schemas/CardBlockInterface'
        blockedCardReplacement:
          $ref: '#/components/schemas/BlockedCardReplacement'
        unblockCardByCardholderAllowed:
          description: 'Defines if the cardholder is allowed to unblock the card.

            '
          type: boolean
          examples:
          - true
    CardMailerText:
      description: Text which will be printed on the letter onto which the card is attached.
      type: string
      minLength: 1
      maxLength: 60
    CardInstanceToken:
      description: Unique card instance token of the card.
      type: string
      pattern: ^CITK-[0-9a-fA-F]{32}$
      minLength: 37
      maxLength: 37
      examples:
      - CITK-1744BC4B31C945A1942F4CCF65EC8D99
    MerchantCategoryCode:
      description: The merchant category code. In a whitelist, the presence of 0 signifies that all merchant category codes are allowed.
      type: integer
      format: int32
      minimum: 0
      maximum: 9999
      examples:
      - 7995
    StartSetPinRequest:
      type: string
      description: "JSON Web Token signed by the issuer to get an ephemeral public key from debiX for the given card. \n* The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.\n* The JOSE header must contain a 'x5t#S256' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)\n"
      examples:
      - see "#/components/schemas/StartSetPinRequestJwsPayload"
    CardMutationRequest:
      description: Fields to modify. Fields that are set will be modified. Others will be ignored.
      type: object
      required:
      - cardTokenExtension
      properties:
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        bccData:
          $ref: '#/components/schemas/CardMutationBccData'
        fraudConfiguration:
          $ref: '#/components/schemas/CardMutationFraudConfiguration'
        cardApplication:
          $ref: '#/components/schemas/CardMutationCardApplication'
        contactlessActivationStatus:
          $ref: '#/components/schemas/CardMutationContactlessActivationStatus'
        featureToggles:
          $ref: '#/components/schemas/CardMutationFeatureToggles'
    CardPlasticCode:
      description: Plastic code of the card.
      type: string
      minLength: 2
      maxLength: 2
      examples:
      - F0
    UnstructuredAddress:
      description: Unstructured address of simple address lines.
      type: array
      minItems: 1
      maxItems: 6
      items:
        type: string
        maxLength: 35
      examples:
      - - Peter Schweizer
        - Bahnhofstrasse 1
        - 8000 Zürich
    UseBankCardWithPin:
      type: boolean
      description: Bank card specific field. Indicator of whether the bank card is used with or without PIN.
    ShortCardId:
      description: Complex object representing a card consisting of bank clearing number, card number and card type.
      type: object
      required:
      - bankClearingNumber
      - cardNumber
      - cardType
      properties:
        bankClearingNumber:
          $ref: '#/components/schemas/BankClearingNumber'
        cardNumber:
          $ref: '#/components/schemas/CardNumber'
        cardType:
          $ref: '#/components/schemas/CardType'
    Region:
      description: Region from where an authorization is requested.
      type: string
      enum:
      - SWITZERLAND_AND_LIECHTENSTEIN
      - EUROPE
      - EASTERN_EUROPE_AND_CENTRAL_ASIA
      - AFRICA
      - CANADA
      - USA_AND_MEXICO
      - LATIN_AMERICA_AND_CARIBBEAN
      - MIDDLE_EAST_ASIA_PACIFIC_AUSTRALIA
    FeatureToggles:
      description: Contains the values of the feature toggles for the card. In card order requests, the contactlessActivationStatus will be ignored. Will be ignored in card order requests for bank cards.
      type: object
      required:
      - eCommerceAllowed
      - trxOnlyAsChipAndPin
      - magStripePaymentAllowed
      - automaticBilling
      - purchaseWithCashBackAllowed
      - merchantInitiatedTrxAllowed
      - atmAllowed
      - posAllowed
      - motoAllowed
      - bypassGeoblocking
      - moneySendReceiveAllowance
      - reservationAllowed
      - transactionPushEnabled
      - gamblingAndBettingAllowance
      properties:
        eCommerceAllowed:
          description: Indicates if the use of ecommerce is allowed.
          type: boolean
        trxOnlyAsChipAndPin:
          description: Indicates if cvm is active, i.e. card can do transaction only as Chip and PIN.
          type: boolean
        magStripePaymentAllowed:
          description: Defines if magnetic stripe payments are allowed.
          type: boolean
        automaticBilling:
          description: Indicates if the cardholder participates to the automatic billing update.
          type: boolean
        purchaseWithCashBackAllowed:
          description: Defines if purchase with cash back is allowed.
          type: boolean
        blockedMerchantCategoryCodes:
          description: List of blocked merchant category codes.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/MerchantCategoryCode'
        merchantInitiatedTrxAllowed:
          description: Indicates if merchant initiated transactions - such as Recurring, Installment, Unscheduled - are allowed.
          type: boolean
        atmAllowed:
          description: Defines if withdrawals are allowed at ATMs.
          type: boolean
        posAllowed:
          description: Defines if payments are allowed at POS terminals.
          type: boolean
        motoAllowed:
          description: Defines if mail or phone orders are allowed.
          type: boolean
        bypassGeoblocking:
          description: Defines if geo blocking is ignored for the card.
          type: boolean
        moneySendReceiveAllowance:
          $ref: '#/components/schemas/MoneySendReceiveAllowance'
        reservationAllowed:
          description: Defines if reservation transactions are allowed.
          type: boolean
        transactionPushEnabled:
          description: Defines if transactions are pushed to debiX.
          type: boolean
        gamblingAndBettingAllowance:
          $ref: '#/components/schemas/GamblingAndBettingAllowance'
        contactlessActivationStatus:
          $ref: '#/components/schemas/ContactlessActivationStatus'
    AccountAuthority:
      description: Indicates who has the right to draw on the account.
      type: object
      properties:
        firstName:
          $ref: '#/components/schemas/FirstName'
        familyName:
          $ref: '#/components/schemas/FamilyName'
        birthdate:
          $ref: '#/components/schemas/Birthdate'
    CardCredentialsRequest:
      type: string
      description: "JSON Web Token signed by the issuer, containing all parameters for securely retrieving sensitive card credentials. \n* The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519. ES256 is recommended.\n* The JOSE header must contain a 'x5t#S256' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)\n"
      examples:
      - see "#/components/schemas/CardCredentialsRequestJwsPayload"
    RestrictedCountries:
      description: 'A list of countries from which authorizations will be declined. Country code values are expected in ISO 3166-1 alpha-2 format.


        The option to define a restriction for individual countries is only available on request; please contact SIX if you are interested.'
      type: array
      minItems: 1
      maxItems: 300
      items:
        $ref: '#/components/schemas/Country'
    CardBlockOrigin:
      description: Initiator and channel of the card blocking.
      type: string
      enum:
      - ONLINE_BANKING_BY_CARDHOLDER
      - MOBILE_BANKING_BY_CARDHOLDER
      - THREE_DS_CARDMANAGEMENT_APP_BY_CARDHOLDER
      - BACKEND_OF_BANK_BY_BANK
      - BACKEND_OF_BANK_BY_CARDHOLDER
      - BANK_DEBIT_ONLINE_WEB_BY_BANK
      - BANK_DEBIT_ONLINE_WEB_BY_CALL_CARDHOLDER
      - SIX_CALLCENTER_BY_CALL_CARDHOLDER
      - SIX_CALLCENTER_DEBIT_ONLINE_WEB_VIA_BLOCKING_MASK_BY_CALL_CARDHOLDER
      - SIX_BY_THIRD_PARTY_ORDER
      - SIX_DEBIT_ONLINE_WEB_VIA_BLOCKING_MASK_BY_THIRD_PARTY_ORDER
      - SIX_DEBIT_ONLINE_WEB_VIA_CARD_MASK_BY_THIRD_PARTY_ORDER
      - SIX_FRAUD_BY_RISKSHIELD_MANUAL
      - SIX_FRAUD_BY_RISKSHIELD_AUTOMATIC
      - SIX_FRAUD_BY_DEBIX
      - SIX_BY_BLOCKING_APPLICATION
    FamilyName:
      description: Family name
      type: string
      maxLength: 25
      examples:
      - Schweizer
    CardMutationFeatureToggles:
      description: Feature Toggles to mutate.
      type: object
      properties:
        eCommerceAllowed:
          description: Indicates if the use of ecommerce is allowed.
          type: boolean
        trxOnlyAsChipAndPin:
          description: Indicates if cvm is active, i.e. card can do transaction only as Chip and PIN.
          type: boolean
        magStripePaymentAllowed:
          description: Defines if magnetic stripe payments are allowed.
          type: boolean
        automaticBilling:
          description: Indicates if the cardholder participates to the automatic billing update.
          type: boolean
        purchaseWithCashBackAllowed:
          description: Defines if purchase with cash back is allowed.
          type: boolean
        blockedMerchantCategoryCodes:
          description: List of blocked merchant category codes.
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/MerchantCategoryCode'
        merchantInitiatedTrxAllowed:
          description: Indicates if merchant initiated transactions - such as Recurring, Installment, Unscheduled - are allowed.
          type: boolean
        atmAllowed:
          description: Defines if withdrawals are allowed at ATMs.
          type: boolean
        posAllowed:
          description: Defines if payments are allowed at POS terminals.
          type: boolean
        motoAllowed:
          description: Defines if mail or phone orders are allowed.
          type: boolean
        bypassGeoblocking:
          description: Defines if geo blocking is ignored for the card.
          type: boolean
        moneySendReceiveAllowance:
          $ref: '#/components/schemas/MoneySendReceiveAllowance'
        reservationAllowed:
          description: Defines if reservation transactions are allowed.
          type: boolean
        transactionPushEnabled:
          description: Defines if transactions are pushed to debiX.
          type: boolean
        gamblingAndBettingAllowance:
          $ref: '#/components/schemas/GamblingAndBettingAllowance'
    ContactlessActivationMode:
      description: Describes the contactless activation mode used during card ordering.
      type: string
      enum:
      - ACCORDING_TO_EMV
      - IMMEDIATE
      - AUTOMATIC
      - DEFERRED
    CardTokenRequest:
      description: Contains the identifier of the card for which to return the card token.
      type: object
      required:
      - shortCardId
      properties:
        shortCardId:
          $ref: '#/components/schemas/ShortCardId'
    ProducerInfo:
      description: Information for the producer of the card. E.g. to print the EUR-label on the card.
      type: string
    GamblingAndBettingAllowance:
      description: Defines condition when gambling and betting transactions are allowed.
      type: string
      enum:
      - ALLOWED
      - NOT_ALLOWED
      - CARD_NOT_PRESENT_NOT_ALLOWED
      - CARD_PRESENT_NOT_ALLOWED
    CardOrderData:
      description: Card data needed to order the card. Online limits are required if they should not be taken over from the parent card. EMV-Profile must be set for a physical card order.
      type: object
      required:
      - cardId
      - accountNumber
      - onlineLimits
      - iban
      - cardMaterial
      - language
      - transactionAuthorizer
      - cardPlasticCode
      properties:
        cardId:
          $ref: '#/components/schemas/CardId'
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        iban:
          $ref: '#/components/schemas/Iban'
        cardMaterial:
          $ref: '#/components/schemas/CardMaterial'
        language:
          $ref: '#/components/schemas/Language'
        chipApplication:
          $ref: '#/components/schemas/ChipApplication'
        branchNumber:
          $ref: '#/components/schemas/BranchNumber'
        transactionAuthorizer:
          $ref: '#/components/schemas/TransactionAuthorizer'
        cardDelivery:
          description: The destination of the card delivery. Must be set for a physical card order.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        cardExpressCode:
          $ref: '#/components/schemas/CardExpressCode'
        cardMailerText:
          $ref: '#/components/schemas/CardMailerText'
        subCardType:
          $ref: '#/components/schemas/SubCardType'
        onlineLimits:
          $ref: '#/components/schemas/OnlineLimits'
        featureToggles:
          $ref: '#/components/schemas/FeatureToggles'
        cardPlasticCode:
          $ref: '#/components/schemas/CardPlasticCode'
        cardOrderReason:
          $ref: '#/components/schemas/CardOrderReason'
        otrcDelivery:
          $ref: '#/components/schemas/OtrcDelivery'
        otrcDatamailerDelivery:
          description: Delivery destination of OTRC datamailer. In bank card orders, this field will be ignored.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        otrcDatamailerExpressCode:
          description: Defines the express code of the OTRC datamailer delivery. In bank card orders, this field will be ignored.
          $ref: '#/components/schemas/DatamailerExpressCode'
        deliveryInformation:
          description: Delivery address of card, PIN and OTRC; only required when OTRC, PIN, or card is delivered to cardholder.
          $ref: '#/components/schemas/DeliveryInformation'
        pinDatamailerDelivery:
          description: Delivery destination of the PIN. Only used for physical cards. If pinData is provided, this field will be ignored.
          $ref: '#/components/schemas/DatamailerDeliveryDestination'
        pinDatamailerExpressCode:
          description: The quickness of the PIN delivery. Only used for physical cards. If pinData is provided, this field will be ignored.
          $ref: '#/components/schemas/DatamailerExpressCode'
        pinData:
          $ref: '#/components/schemas/CardOrderPinData'
        pinMailerTextCode:
          description: Reference to a predefined text container that will be printed on the PIN datamailer. If pinData is provided, this field will be ignored.
          $ref: '#/components/schemas/MailerTextCode'
        producerCode:
          $ref: '#/components/schemas/ProducerCode'
        producerInfo:
          $ref: '#/components/schemas/ProducerInfo'
        emvProfile:
          $ref: '#/components/schemas/EmvProfile'
        cardholderDataTrack:
          $ref: '#/components/schemas/CardholderDataTrack'
        cardLine1:
          $ref: '#/components/schemas/CardLine'
        cardLine2:
          $ref: '#/components/schemas/CardLine'
        cardLine3:
          $ref: '#/components/schemas/BankCardLine'
        cardLine4:
          $ref: '#/components/schemas/BankCardLine'
        bankDataTrack2:
          description: Bank card specific field which indicates the data for track2. It is mandatory for bank cards. The content of this field has to be agreed with the card producer and will not be checked by SIX.
          type: integer
          format: int32
          minimum: 0
          maximum: 999999
        bankDataTrack3:
          description: Bank card specific field which indicates the data for track3. The content of this field has to be agreed with the card producer and will not be checked by SIX.
          type: integer
          format: int64
          minimum: 0
          maximum: 999999999999
        useBankCardWithPin:
          $ref: '#/components/schemas/UseBankCardWithPin'
        contactlessActivationMode:
          $ref: '#/components/schemas/ContactlessActivationMode'
    ChipApplication:
      description: Indicates what chip will be applied to the card. If no chipApplication is provided, EMVI20 will be applied in the order.
      type: string
      enum:
      - EMVI20
      - EMVI24
    CardId_2:
      description: Complex object representing a card consisting of bank clearing number, card number, card type, card sequence number and card expiry.
      type: object
      required:
      - bankClearingNumber
      - cardNumber
      - cardType
      - cardSeqNumber
      - cardExpiry
      properties:
        bankClearingNumber:
          $ref: '#/components/schemas/BankClearingNumber'
        cardNumber:
          $ref: '#/components/schemas/CardNumber'
        cardType:
          $ref: '#/components/schemas/CardType'
        cardSeqNumber:
          $ref: '#/components/schemas/CardSeqNumber'
        cardExpiry:
          $ref: '#/components/schemas/YearMonth'
    YearMonth:
      type: object
      required:
      - month
      - year
      properties:
        month:
          description: The two digit number of the month starting at 01 for January.
          type: string
          examples:
          - '01'
        year:
          description: The last two digits of the year.
          type: string
          examples:
          - '21'
    CardType:
      description: 'A single digit that distinguishes the card types of the schemes.

        - 1: Debit mastercard

        - 3: Visa debit

        - 6: Bank card'
      type: integer
      format: int32
      minimum: 1
      maximum: 6
    GetPinResponse:
      type: string
      description: "JSON Web Token signed by debiX containing the encrypted PIN and an ephemeral public key to complete the Diffie-Hellman key exchange. \n* The algorithm of the JWS signature can be one of RS256/384/512, PS256/384/512, ES256/384/512 or EdDsa/Ed25519.\n* The JOSE header contains a 'x5t#S256' parameter with the X.509 certificate SHA-256 thumbprint of the key used to sign the token. (https://datatracker.ietf.org/doc/html/rfc7515#section-4.1.8)\n"
      examples:
      - see encrypted object at "#/components/schemas/GetPinResponseJwsPayload".
    CardStatus:
      description: The status of the card.
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - DELETED
      - SUSPENSION_PENDING
      - RESUMPTION_PENDING
      - DELETE_PENDING
    CardLine:
      description: This line will be printed on the front side of the card. At least the first card line is required for a physical card order.
      type: string
    TransactionAuthorizer:
      type: string
      description: Authorizer for retail and ATM transactions.
      enum:
      - ALWAYS_SIX
      - ISSUER_WITH_FALLBACK_SIX
      - SIX_WITH_FALLBACK_ISSUER
      - ISSUER_WITH_FALLBACK_SIX_AND_OTHER_LIMITS
    CardSeqNumber:
      description: Sequence number of the card.
      type: integer
      format: int32
      minimum: 0
      maximum: 9
      examples:
      - 2
    UpdateCardStatusAction:
      description: Distinguishes the type of the card update.
      type: string
      enum:
      - BLOCK
      - UNBLOCK
      - DELETE_IMMEDIATELY
      - DELETE_AT_END_OF_NEXT_MONTH
    CardMaterial:
      description: Distinguishes physical from virtual cards. VIRTUAL not allowed for bank cards.
      type: string
      enum:
      - PHYSICAL
      - VIRTUAL
    ResetPinTryCounterRequest_2:
      description: Contains the identifier of the card for which to request the reset of the PIN try counter.
      type: object
      required:
      - cardId
      properties:
        cardId:
          $ref: '#/components/schemas/CardId_2'
    CardMutationCardApplication:
      description: Controls card application settings for the EMV-Profile, online limits and transaction authorizer.
      type: object
      properties:
        emvProfile:
          $ref: '#/components/schemas/EmvProfile'
        onlineLimits:
          $ref: '#/components/schemas/OnlineLimits'
        transactionAuthorizer:
          $ref: '#/components/schemas/TransactionAuthorizer'
    CardInstanceTokenByCardIdRequest:
      description: Contains the identifier of the card for which to return the card instance token.
      type: object
      required:
      - cardId
      properties:
        cardId:
          $ref: '#/components/schemas/CardId'
    CardOrderResponse:
      description: 'Contains the card token and the card instance token for the newly created card.

        These tokens can be used immediately to perform subsequent card-related operations.

        '
      type: object
      required:
      - cardToken
      - cardInstanceToken
      properties:
        cardToken:
          $ref: '#/components/schemas/CardToken'
        cardInstanceToken:
          $ref: '#/components/schemas/CardInstanceToken'
    Language:
      description: Correspondence language.
      type: string
      enum:
      - DE
      - FR
      - IT
      - EN
    OnlineLimits:
      description: The monthly and daily retail and cash transactions limits.
      type: object
      required:
      - totalLimitPerMonth
      - cashLimitPerMonth
      - totalLimitPerDay
      - cashLimitPerDay
      properties:
        totalLimitPerMonth:
          description: Total limit per month for retail and money in cash transactions in whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
          - 20000
        cashLimitPerMonth:
          description: Limit per month for money in cash transactions in whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
          - 10000
        totalLimitPerDay:
          description: Total limit per day for retail and money in cash transactions in whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
          - 5000
        cashLimitPerDay:
          description: Limit per day for money in cash transactions in whole Swiss Francs.
          type: integer
          format: int32
          maximum: 99999999
          examples:
          - 1000
    OtrcDelivery:
      description: Deprecated and will be ignored. Delivery type of OTRC.
      type: string
      enum:
      - NONE
      - DATAMAILER
      - ONLINE
      default: NONE
    CardOrderReason:
      description: This setting determines the priority in which a physical card is ordered. Daily business orders are processed with higher priority and sent to the producer after 18:30. Card renewal orders due to card expiration are processed with lower priority and sent to the producer after 08:00.
      type: string
      enum:
      - DAILY_BUSINESS
      - CARD_RENEWAL
      default: DAILY_BUSINESS
    UpdateCardStatusRequest:
      description: Contains the request to update the status of the card. The card block reason is required when blocking the card. Only when blocking a card, the information in card block reason, card block origin and blocked card replacement are taken into account; in other cases, they are ignored.
      type: object
      required:
      - action
      - cardTokenExtension
      - cardStatusUpdateReason
      properties:
        action:
          $ref: '#/components/schemas/UpdateCardStatusAction'
        cardTokenExtension:
          $ref: '#/components/schemas/CardTokenExtension'
        cardStatusUpdateReason:
          $ref: '#/components/schemas/CardStatusUpdateReason'
        cardBlockReason:
          $ref: '#/components/schemas/CardBlockReason'
