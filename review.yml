  gaps:
  - No public OpenAPI or base URL for the flagship SIX Web API or Bulk API; specs live behind the login-gated bfi portal.
  - bLink publishes full HTML API reference and a Postman collection zip but no raw OpenAPI file on the public docs site.
  - No public pricing for any financial data product; fixed-fee bulk packages mentioned without numbers.
  - No public status page for the developer platform itself (the SIC Service Status API covers payment services, not the APIs).
