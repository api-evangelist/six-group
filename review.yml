aid: six-group
name: SIX
review:
  question: Does SIX expose a public, documented API surface for its financial market data and infrastructure services?
  answer: true
  date: '2026-07-21'
  reviewer: API Evangelist
findings:
  summary: |
    SIX runs a real public developer portal (developer.six-group.com, HTTP 200)
    that fronts a two-tier API posture. The flagship financial data products -
    SIX Web API (REST/JSON, GraphQL, WebSocket over 900+ price sources) and
    SIX Bulk API - are publicly marketed but sales-gated: documentation, data
    dictionary, and a Swagger test interface sit behind the SIX API Portal
    (web.apiportal.six-group.com), access uses MTLS certificate
    authentication, and onboarding is via a demo-access request form rather
    than self-serve keys. No public OpenAPI spec or base URL is published for
    Web API or Bulk API. In contrast, the Swiss payment/banking infrastructure
    side is genuinely open: a Kong-based shared catalog
    (apiportal.six-group.com, HTTP 200) publishes four APIs with downloadable
    OAS3 specs (Swiss Bank Master, SIC Service Status, SIC Clearing Day
    Calendar, Settlement Info Reporting), and two documented production
    endpoints answered HTTP 200 without any authentication on the review
    date. The debiX debit card platform (docs.debix.six-group.com,
    Docusaurus/Redocusaurus) publishes four verbatim-downloadable OpenAPI
    3.x specs with documented production hosts on api.six-group.com. bLink,
    Switzerland's open banking platform (docs.blink.six-group.com), has full
    public HTML API reference (AIS, PSS, OpenWealth, consent modules) with
    OAuth consent flows and TLS certificates, plus a downloadable Postman
    collection and example payloads, but no raw OpenAPI file download was
    found on the docs site. Beyond HTTP, SIX documents a streaming Market
    Data Feed, SIX Flex and Valordata Feed file delivery, Snowflake cloud
    data delivery, and SIX Connect private cloud connectivity.
  posture:
    developerPortal: https://developer.six-group.com
    selfServe: false
    salesGated: true
    salesGatedNote: Web API and Bulk API require demo-access request and MTLS certificates; bLink requires platform admission; debiX is for issuer banks. The four shared-catalog Swiss infrastructure APIs are open, and two production endpoints respond unauthenticated.
    authModels:
    - MTLS certificates (Web API, Bulk API, bLink transport)
    - OAuth consent flows (bLink)
    - None on probed SIC/bankmaster public endpoints
    pricingPublic: false
    ownership: SIX Group Ltd, Zurich - owned by ~120 national and international financial institutions; parent of SIX Swiss Exchange, BME (Spanish exchanges, acquired 2020), SIX Financial Information, SIX Interbank Clearing, and SIX SIS.
  deliveryChannels:
  - REST/JSON (Web API, Bulk API, debiX, shared catalog)
  - GraphQL (Web API)
  - WebSocket (Web API real-time streaming)
  - Streaming Market Data Feed (sales-gated feed product)
  - Flat files (SIX Flex, Valordata Feed)
  - Cloud shares (Snowflake Cloud Data Delivery, SIX Connect on AWS/GCP/Azure)
