    type: Documentation
  description: REST/JSON bulk retrieval of the entire SIX financial data catalog - corporate
    actions, equities and fixed income reference data, and end-of-day pricing - as full extracts
    or delta updates since a given date/time, using ISO-standard formats and MTLS certificate
    authentication. Fixed-fee packages, sales-gated with trial access by request.
