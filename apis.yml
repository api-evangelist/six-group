url: https://raw.githubusercontent.com/api-evangelist/six-group/refs/heads/main/apis.yml
name: SIX
kind: company
description: SIX operates the financial market infrastructure of Switzerland and Spain, including
  SIX Swiss Exchange, BME, and Swiss interbank clearing and securities services, alongside SIX
  Financial Information, one of the largest global market data vendors. It sells real-time,
  intraday, end-of-day, and historical pricing, reference data, corporate actions, and regulatory/ESG
  datasets from more than 900 price sources, delivered via the SIX Web API (REST/JSON, GraphQL,
  WebSocket), the SIX Bulk API, streaming Market Data Feed, SIX Flex and Valordata Feed files,
  and Snowflake cloud shares. A public developer portal at developer.six-group.com fronts the
  bLink open banking platform, the debiX debit card API, and a shared Kong-based API catalog
  with Swiss interbank clearing and settlement APIs. Financial data access is enterprise and
  sales-gated with MTLS certificate authentication, while several Swiss payment infrastructure
  APIs are publicly documented with downloadable OpenAPI.
