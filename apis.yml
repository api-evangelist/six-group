    type: Documentation
  - url: https://web.apiportal.six-group.com/portal/bfi/catalog
    type: Portal
  description: Single API onto the SIX financial data universe - real-time, intraday, end-of-day,
    and historical pricing across asset classes, reference data, corporate actions, tax, and
    ESG datasets from 900+ price sources - using REST/JSON, GraphQL, and WebSocket streaming
    with MTLS certificate authentication. Documentation, sample code, and a Swagger test interface
    live behind the SIX API Portal; access is sales-gated with demo access by request.
